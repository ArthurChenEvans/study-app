<style>
  /* studyapp theme, same values as docs/design-rules.md */
  :root, [data-theme="studyapp"] {
    color-scheme: light;
    --color-base-100: oklch(97% 0.010 80);
    --color-base-200: oklch(94% 0.014 78);
    --color-base-300: oklch(89% 0.018 75);
    --color-base-content: oklch(27% 0.025 60);
    --color-primary: oklch(40% 0.065 50);
    --color-primary-content: oklch(97% 0.010 80);
    --color-secondary: oklch(32% 0.02 60);
    --color-secondary-content: oklch(94% 0.014 78);
    --color-accent: oklch(78% 0.13 78);
    --color-accent-content: oklch(27% 0.025 60);
    --color-neutral: oklch(32% 0.02 60);
    --color-neutral-content: oklch(94% 0.014 78);
    --color-info: oklch(44% 0.07 235);
    --color-info-content: oklch(97% 0.010 80);
    --color-success: oklch(42% 0.11 145);
    --color-success-content: oklch(97% 0.010 80);
    --color-warning: oklch(78% 0.13 78);
    --color-warning-content: oklch(27% 0.025 60);
    --color-error: oklch(44% 0.15 30);
    --color-error-content: oklch(97% 0.010 80);
    --radius-selector: 0.25rem;
    --radius-field: 0.375rem;
    --radius-box: 0.5rem;
    --size-selector: 0.25rem;
    --size-field: 0.25rem;
    --border: 1px;
    --depth: 0;
    --noise: 0;

    /* Raised surface for panels, and chart tokens (validated, see design rules) */
    --surface: oklch(99% 0.006 80);
    /* Quiz outcomes: blue / orange pair, colour-blind safe; guessed = hatched right */
    --chart-right: #025884;
    --chart-wrong: #cc6c13;
    --right-ink: #004d77;
    --wrong-ink: #853900;
    --guessed-tint: #c1dcf0;
    --guessed-ink: #013658;
    --guessed-fill: repeating-linear-gradient(135deg, #025884 0 2px, #c1dcf0 2px 6px);
    --chart-ink: #643d26;
    --chart-grid: oklch(91% 0.016 76);
    --muted: oklch(42% 0.022 65);
    --shadow-panel: 0 1px 2px oklch(27% 0.025 60 / .06), 0 6px 16px oklch(27% 0.025 60 / .05);
    --shadow-soft: 0 1px 2px oklch(27% 0.025 60 / .08);
    --field-border: oklch(58% 0.02 65);
    --on-right: #fff;
    --on-wrong: #140d08;
    --diagram-fill: oklch(94% 0.014 78);
  }
  /* Dark theme: its own palette, validated against the dark panel surface (see design rules) */
  [data-theme="studyapp-dark"] {
    color-scheme: dark;
    --color-base-100: oklch(19% 0.012 65);
    --color-base-200: oklch(16% 0.012 65);
    --color-base-300: oklch(32% 0.016 65);
    --color-base-content: oklch(93% 0.012 80);
    --color-primary: oklch(74% 0.10 62);
    --color-primary-content: oklch(18% 0.012 65);
    --color-secondary: oklch(88% 0.015 75);
    --color-secondary-content: oklch(18% 0.012 65);
    --color-accent: oklch(80% 0.13 80);
    --color-accent-content: oklch(18% 0.012 65);
    --color-neutral: oklch(88% 0.015 75);
    --color-neutral-content: oklch(18% 0.012 65);
    --color-info: oklch(76% 0.08 235);
    --color-info-content: oklch(18% 0.012 65);
    --color-success: oklch(76% 0.13 145);
    --color-success-content: oklch(18% 0.012 65);
    --color-warning: oklch(80% 0.13 80);
    --color-warning-content: oklch(18% 0.012 65);
    --color-error: oklch(76% 0.13 30);
    --color-error-content: oklch(18% 0.012 65);
    --radius-selector: 0.25rem; --radius-field: 0.375rem; --radius-box: 0.5rem;
    --size-selector: 0.25rem; --size-field: 0.25rem; --border: 1px; --depth: 0; --noise: 0;

    --surface: oklch(23% 0.014 65);
    --chart-right: #0573aa;
    --chart-wrong: #d67523;
    --right-ink: #87c6f2;
    --wrong-ink: #f9b379;
    --guessed-tint: #163c54;
    --guessed-ink: #bbddf6;
    --guessed-fill: repeating-linear-gradient(135deg, #0573aa 0 2px, #163c54 2px 6px);
    --chart-ink: oklch(74% 0.10 62);
    --chart-grid: oklch(30% 0.014 65);
    --muted: oklch(78% 0.016 75);
    --field-border: oklch(52% 0.018 70);
    --on-right: #fff;
    --on-wrong: #140d08;
    --diagram-fill: oklch(28% 0.014 65);
    --shadow-panel: 0 1px 0 oklch(100% 0 0 / .04) inset, 0 1px 2px oklch(0% 0 0 / .4), 0 8px 24px oklch(0% 0 0 / .25);
    --shadow-soft: 0 1px 2px oklch(0% 0 0 / .4);
  }
  body { background: var(--color-base-100); color: var(--color-base-content); font-family: "IBM Plex Sans", ui-sans-serif, sans-serif; }
  code, pre, .font-mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  h1, h2 { text-wrap: balance; }
  h1 { letter-spacing: -0.015em; }
  .input, .select, .textarea, .checkbox, .radio { border-color: var(--field-border); }
  .input, .select, .textarea { background: var(--surface); }
  :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  pre.shiki { padding: 12px 16px; border-radius: var(--radius-box); font-size: 14px; overflow-x: auto; border: 1px solid var(--color-base-300); }
  .divide-y > * { border-color: var(--color-base-300) !important; }
  .btn .kbd { background: transparent; border-color: currentColor; color: inherit; opacity: .8; }
  .btn { transition: transform 120ms ease-out, background-color 150ms ease-out, box-shadow 150ms ease-out; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn-primary { box-shadow: 0 1px 2px oklch(27% 0.025 60 / .25), inset 0 1px 0 oklch(100% 0 0 / .12); }

  /* Panels: the one raised surface. Used for groups you read as a unit (charts, summaries) */
  .panel { background: var(--surface); border: 1px solid var(--color-base-300); border-radius: 12px; box-shadow: var(--shadow-panel); }
  .eyebrow { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  /* Segmented control */
  .seg { display: inline-flex; align-items: stretch; height: 2rem; padding: 2px; gap: 2px; border: 1px solid var(--field-border); border-radius: var(--radius-field); background: var(--color-base-200); vertical-align: middle; }
  .seg > button { padding: 0 12px; font-size: 14px; line-height: 1; border-radius: calc(var(--radius-field) - 2px); color: var(--muted); transition: background-color 150ms ease-out, color 150ms ease-out; }
  .seg > button:hover:not([aria-checked="true"]) { background: var(--color-base-300); color: var(--color-base-content); }
  .seg > button[aria-checked="true"] { background: var(--color-neutral); color: var(--color-neutral-content); font-weight: 600; }
  .seg > button:focus-visible { outline-offset: 1px; }
  /* Fields: one focus ring */
  .input:focus, .input:focus-within, .select:focus, .textarea:focus { outline: none !important; border-color: var(--color-primary) !important; box-shadow: 0 0 0 1px var(--color-primary) !important; }
  label.input input:focus, label.input input:focus-visible { outline: none !important; box-shadow: none !important; }
  .input-sm, .seg { min-height: 2rem; }
  .btn:disabled .kbd { opacity: .5; }
  .toggle:checked { background-color: var(--color-primary); border-color: var(--color-primary); color: var(--color-primary-content); }
  [role=tab] .count { font-size: 12px; margin-left: 4px; color: var(--muted); font-weight: 400; }
  .open-q { border: 1px dashed var(--color-info); color: var(--color-info); background: var(--surface); }

  /* Navigation */
  .nav-link { color: var(--muted); transition: background-color 150ms ease-out, color 150ms ease-out; }
  .nav-link:hover { background: var(--color-base-300); color: var(--color-base-content); }
  .nav-link[aria-current="page"] { background: var(--surface); color: var(--color-base-content); font-weight: 600; box-shadow: var(--shadow-soft); }

  /* Charts */
  .seg-bar { display: flex; gap: 2px; border-radius: 999px; overflow: hidden; }
  .seg-bar > span { display: block; height: 100%; }
  .tall-bar { display: flex; gap: 2px; height: 28px; }
  .tall-bar > span { border-radius: 4px; display: flex; align-items: center; padding-left: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: visible; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .text-right-ink { color: var(--right-ink); } .text-wrong-ink { color: var(--wrong-ink); }
  .is-right { border-color: var(--chart-right) !important; box-shadow: 0 0 0 1px var(--chart-right); }
  .is-wrong { border-color: var(--chart-wrong) !important; box-shadow: 0 0 0 1px var(--chart-wrong); }
  .guessed-chip { background: var(--guessed-tint); color: var(--guessed-ink); border-color: var(--guessed-tint); }
  .hbar { height: 12px; border-radius: 0 4px 4px 0; background: var(--chart-ink); transition: width 400ms ease-out; }
  .cell { width: 24px; height: 24px; border-radius: 4px; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #fff; }
  .chart-tip { position: fixed; pointer-events: none; z-index: 50; background: var(--color-neutral); color: var(--color-neutral-content); font-size: 12px; line-height: 1.4; padding: 8px 10px; border-radius: 6px; box-shadow: 0 4px 12px oklch(27% 0.025 60 / .2); opacity: 0; transition: opacity 120ms ease-out; max-width: 240px; }
  .chart-tip.show { opacity: 1; }
  details.table-view summary { cursor: pointer; font-size: 12px; color: var(--muted); }

  /* Quiz progress track */
  .track { display: flex; gap: 2px; height: 6px; }
  .track > span { flex: 1; border-radius: 2px; background: var(--color-base-300); }

  /* Motion */
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise 260ms ease-out both; }
  .rise-2 { animation-delay: 60ms; } .rise-3 { animation-delay: 120ms; } .rise-4 { animation-delay: 180ms; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
:root { --strip: 2.5rem; }
</style>
<style type="text/tailwindcss">
  @theme {
    --color-muted: var(--muted);
    --color-field-border: var(--field-border);
    --color-surface: var(--surface);
    --font-sans: "IBM Plex Sans", ui-sans-serif, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
</style>
<style>
  /* Projects, drills and calendar additions. Same tokens as the other prototypes. */
  .badge-src { font-size: 12px; color: var(--muted); border: 1px solid var(--color-base-300); border-radius: 4px; padding: 0 6px; line-height: 20px; white-space: nowrap; }
  .kind { font-size: 12px; border-radius: 4px; padding: 0 6px; line-height: 20px; white-space: nowrap; border: 1px solid var(--field-border); }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal-day { min-height: 104px; border-right: 1px solid var(--color-base-300); border-bottom: 1px solid var(--color-base-300); padding: 6px 8px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
  .cal-day:hover { background: var(--color-base-200); }
  .cal-day[aria-current="date"] { box-shadow: inset 0 0 0 2px var(--color-base-content); }
  .cal-day[aria-selected="true"] { background: var(--color-base-200); }
  .cal-day.other { color: var(--muted); }
  .cal-day .num { font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .cal-row { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cal-row b { color: var(--color-base-content); font-weight: 600; }
  .cal-past .cal-row { opacity: 1; }
  .timer-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-variant-numeric: tabular-nums; border: 1px solid var(--field-border); border-radius: 999px; padding: 2px 10px; }
  .step-dot { width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center; font-size: 12px; font-variant-numeric: tabular-nums; }
  .rate { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 9rem; padding: 10px 16px; height: auto; }
  .rate .when { font-size: 12px; font-weight: 400; opacity: .85; }
  .text-right-ink { color: var(--right-ink); } .text-wrong-ink { color: var(--wrong-ink); }
  .ladder { display: flex; gap: 4px; }
  .ladder > span { flex: 1; height: 6px; border-radius: 2px; background: var(--color-base-300); }
  .ladder > span.on { background: var(--chart-ink); }
  .ladder > span.now { background: transparent; box-shadow: inset 0 0 0 2px var(--color-base-content); }
</style>
</head>

    <a href="#topics" data-nav="topics" onclick="event.preventDefault(); go('topics')" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm"><i data-lucide="library" class="size-4"></i><span class="flex-1">Topics</span><span class="text-xs tabular-nums" aria-label="2 quizzes due today">2</span></a>
    <a href="flashcards.html#cards" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm"><i data-lucide="square-stack" class="size-4"></i><span class="flex-1">Cards</span><span class="text-xs tabular-nums" aria-label="12 cards due today">12</span></a>

<script>
const icon = (name, cls = "size-4") => `<i data-lucide="${name}" class="${cls}" aria-hidden="true"></i>`;
const kbd = (k) => `<kbd class="kbd kbd-xs">${k}</kbd>`;
const header = (title, subtitle = "", actions = "") => `<header class="flex items-end justify-between gap-6 pt-12 pb-8"><div><h1 class="text-3xl font-semibold leading-tight">${title}</h1>${subtitle ? `<p class="mt-2 text-muted">${subtitle}</p>` : ""}</div><div class="flex items-center gap-2">${actions}</div></header>`;
const back = (label, screen, v) => `<button class="mt-8 inline-flex items-center gap-1 py-1 text-sm text-muted hover:underline" onclick="go('${screen}'${v ? `,'${v}'` : ""})">${icon("arrow-left")}${label}</button>`;
const TYPES = { cards: ["square-stack", "cards", "card", "Cards"], recall: ["brain", "checklists", "checklist", "Recall"], quiz: ["list-checks", "quizzes", "quiz", "Quizzes"], drill: ["dumbbell", "drills", "drill", "Drills"] };

const variants = {
  calendar: ["month", "today", "a past day", "a future day", "move a drill"],
  projects: ["list", "first time", "issues"],
  project: ["struggles", "session running", "log a struggle"],
  review: ["recall miss", "apply miss, known drill", "new drill", "confirm the date", "done"],
  drill: ["doing it", "rated shaky", "rated solid"],
  topics: ["quiz due", "results move up", "schedule settings"],
};
const state = { screen: "calendar", variant: "month" };

/* ---------------- Sample data ---------------- */
const TODAY = 3; // Tue 3 Nov 2026
const due = {
  // day of November → counts
  1: { done: { cards: 9 } }, 2: { done: { cards: 14, quiz: 1, struggles: 3 } },
  3: { cards: 12, recall: 1, quiz: 2, drill: 2 },
  4: { cards: 4, drill: 1 }, 5: { cards: 9, quiz: 1 }, 6: { cards: 3 }, 7: { cards: 7 }, 9: { cards: 31, recall: 1 },
  10: { cards: 6, quiz: 1 }, 12: { cards: 5 }, 13: { cards: 8, recall: 1 }, 16: { cards: 4, quiz: 2 }, 17: { cards: 6 }, 20: { cards: 3, recall: 1 }, 24: { cards: 5, quiz: 1 }, 30: { cards: 2, recall: 1 },
};
const october = { 26: { done: { cards: 11, quiz: 1 } }, 27: { done: { cards: 8, recall: 1, struggles: 2 } }, 28: { done: { cards: 12 } }, 29: { done: { cards: 6, quiz: 2 } }, 30: { done: { cards: 10, struggles: 1 } }, 31: { done: { cards: 7 } } };

/* ---------------- Calendar ---------------- */
function rows(counts, past) {
  return Object.entries(TYPES).filter(([key]) => counts[key]).map(([key, [ic, plural, single]]) =>
    `<span class="cal-row">${icon(ic, "size-3.5")}<b>${counts[key]}</b> ${counts[key] === 1 ? single : plural}<span class="sr-only">${past ? " done" : " due"}</span></span>`).join("")
    + (counts.struggles ? `<span class="cal-row">${icon("triangle-alert", "size-3.5")}<b>${counts.struggles}</b> ${counts.struggles === 1 ? "struggle" : "struggles"}</span>` : "");
}
function screenCalendar() {
  const v = state.variant;
  if (v !== "month") return dayView(v);
  const cells = [];
  [26, 27, 28, 29, 30, 31].forEach(d => cells.push({ d, other: true, counts: october[d].done, past: true }));
  for (let d = 1; d <= 30; d++) { const info = due[d] || {}; cells.push({ d, past: d < TODAY, counts: d < TODAY ? info.done || {} : info }); }
  for (let d = 1; d <= 6; d++) cells.push({ d, other: true, counts: d === 1 ? { cards: 4 } : d === 4 ? { cards: 6, recall: 1 } : {} });
  return `<div class="mx-auto max-w-6xl px-12 pb-24">
    ${header("Calendar", "Everything due, day by day. Past days show what you did.", `<button class="btn btn-ghost btn-square btn-sm" aria-label="Previous month">${icon("chevron-left")}</button><span class="w-36 text-center font-semibold">November 2026</span><button class="btn btn-ghost btn-square btn-sm" aria-label="Next month">${icon("chevron-right")}</button><button class="btn btn-outline btn-sm border-field-border ml-2">Today</button>`)}
    <div class="mb-3 flex flex-wrap items-center gap-4 text-xs text-muted" aria-label="Key">
      ${Object.values(TYPES).map(([ic, , , label]) => `<span class="flex items-center gap-1.5">${icon(ic, "size-3.5")}${label}</span>`).join("")}
      <span class="flex items-center gap-1.5">${icon("triangle-alert", "size-3.5")}Struggles logged</span>
      <span class="ml-auto">Future cards are a forecast and move as you review</span>
    </div>
    <div class="panel overflow-hidden">

  </div>
  <div class="fixed bottom-0 left-0 right-0 border-t border-base-300 bg-base-100 py-6"><div class="mx-auto flex max-w-prose items-center justify-center gap-3">
    <button class="btn rate btn-outline border-field-border" style="color: var(--wrong-ink)" onclick="setVariant('rated shaky')"><span>Struggled ${kbd("1")}</span><span class="when">Again tomorrow</span></button>
    <button class="btn rate btn-outline border-field-border" onclick="setVariant('rated shaky')"><span>Shaky ${kbd("2")}</span><span class="when">Again tomorrow</span></button>
    <button class="btn rate btn-primary" onclick="setVariant('rated solid')"><span>Solid ${kbd("3")}</span><span class="when">Ticked off</span></button>
  </div><p class="mt-3 text-center text-xs text-muted">How did it go?</p></div>`;
}

/* ---------------- Topics with quiz scheduling ---------------- */
function screenTopics() {
  const v = state.variant;
  if (v === "results move up") return `<div class="mx-auto max-w-6xl px-12 pb-24">${header("Results", "Study mode · 13 questions")}
    <section class="panel p-8"><p class="text-6xl font-semibold leading-none">10 <span class="text-3xl font-normal text-muted">/ 13</span></p></section>
    <section class="panel mt-6 p-6" aria-labelledby="sched-h"><h2 id="sched-h" class="text-sm font-semibold">Quiz schedule</h2>
      <ul class="mt-4 divide-y">
        <li class="grid grid-cols-[160px_1fr_auto] items-center gap-6 py-3"><span class="font-semibold">CPU</span><span class="flex items-center gap-2 text-sm text-right-ink font-semibold">${icon("arrow-up")}86%, moves up to Fortnight</span><span class="text-sm text-muted">Next quiz Tue 17 Nov</span></li>
        <li class="grid grid-cols-[160px_1fr_auto] items-center gap-6 py-3"><span class="font-semibold">OSI model</span><span class="flex items-center gap-2 text-sm text-wrong-ink font-semibold">${icon("arrow-down")}50%, under 70%, stays on Day</span><span class="text-sm text-muted">Next quiz tomorrow</span></li>
      </ul><p class="mt-3 text-xs text-muted">Each topic is scored on its own questions in this quiz. Retries don't move the schedule.</p></section></div>`;
  if (v === "schedule settings") return `<div class="mx-auto max-w-6xl px-12 pb-24 opacity-40" aria-hidden="true">${header("Topics")}</div>
    <dialog open class="modal modal-open" aria-labelledby="qs-h"><div class="modal-box max-w-xl"><h3 id="qs-h" class="text-lg font-semibold">Quiz schedule</h3>
      <p class="mt-2 text-sm text-muted">The same kind of ladder as recall, kept separately. Changes apply from each topic's next quiz.</p>
      <ol class="mt-5 space-y-2">${[["Day", 1, 1], ["Week", 1, 1], ["Fortnight", 2, 1], ["Month", 1, 6], ["Season", 3, 4], ["Year", 1, "for good"]].map(([n, c, r], i) => `<li class="flex items-center gap-3"><span class="w-6 text-right text-xs tabular-nums text-muted">${i + 1}</span><input class="input input-sm w-32" aria-label="Step ${i + 1} name" value="${n}"><span class="text-sm text-muted">every</span><input class="input input-sm w-16 tabular-nums" aria-label="Step ${i + 1} count" value="${n === "Fortnight" ? 2 : n === "Season" ? 3 : 1}"><select class="select select-sm w-28" aria-label="Step ${i + 1} unit"><option>${n === "Day" ? "days" : n === "Week" || n === "Fortnight" ? "weeks" : n === "Year" ? "years" : "months"}</option></select><span class="text-sm text-muted">× ${r}</span></li>`).join("")}</ol>
      <label class="mt-5 flex items-center gap-3"><span class="text-sm font-semibold">Pass mark</span><input class="input input-sm w-20 tabular-nums" value="70"><span class="text-sm text-muted">% of the topic's questions right</span></label>
      <div class="modal-action"><button class="btn btn-ghost mr-auto">${icon("rotate-ccw")}Reset</button><button class="btn btn-ghost">Cancel</button><button class="btn btn-primary">Save schedule</button></div></div></dialog>`;
  const rowsT = [["CPU", "Computer Architecture", 7, "Week", "Today", 3, true], ["OSI model", "Networks", 6, "Day", "Today", 1, true], ["Memory", "Computer Architecture", 4, "Fortnight", "Mon 9 Nov", 4, false], ["TCP/IP", "Networks", 5, "Not started", "Quiz it to start", 0, false]];
  return `<div class="mx-auto max-w-6xl px-12 pb-24">${header("Topics", "2 quizzes due today", `<button class="btn btn-ghost">${icon("settings-2")}Quiz schedule</button><button class="btn btn-ghost">${icon("plus")}New topic</button><button class="btn btn-primary">${icon("play")}Quiz the 2 due topics</button>`)}
    <div class="panel overflow-hidden"><table class="table" aria-label="Topics"><thead><tr class="text-muted"><th>Topic</th><th>Questions</th><th>Quiz step</th><th>Next quiz</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>
      ${rowsT.map(([n, m, q, s, next, pos, dueNow]) => `<tr class="hover:bg-base-100"><td><span class="font-semibold">${n}</span><div class="text-xs text-muted">${m}</div></td><td class="tabular-nums">${q}</td>
        <td><div class="w-40"><span class="text-sm">${s}</span>${pos ? `<div class="ladder mt-1" aria-hidden="true">${[1, 2, 3, 4, 5, 6].map(i => `<span class="${i < pos ? "on" : i === pos ? "now" : ""}"></span>`).join("")}</div>` : ""}</div></td>
        <td class="text-sm ${dueNow ? "font-semibold" : next.startsWith("Quiz") ? "text-muted" : ""}">${next}</td>
        <td class="text-right"><div class="flex justify-end gap-1"><button class="btn btn-ghost btn-sm">Edit</button><button class="btn btn-ghost btn-sm">Quiz</button></div></td></tr>`).join("")}
    </tbody></table></div>
    <p class="mt-3 text-sm text-muted">A topic's schedule starts the first time you quiz it. Each quiz scores every topic in it on its own questions.</p></div>`;
}

/* ---------------- Render ---------------- */
const screens = { calendar: screenCalendar, projects: screenProjects, project: screenProject, review: screenReview, drill: screenDrill, topics: screenTopics };
const screenNames = { calendar: "Calendar", projects: "Projects", project: "A project", review: "Session review", drill: "Doing a drill", topics: "Quiz scheduling" };
const navOf = { calendar: "calendar", projects: "projects", project: "projects", review: "projects", drill: "projects", topics: "topics" };
function setVariant(v) { state.variant = v; render(); }
function go(screen, v) { state.screen = screen; state.variant = v || variants[screen][0]; try { history.replaceState(null, "", `#${screen}`); } catch (e) {} render(); window.scrollTo(0, 0); }
function render() {
  const el = document.getElementById("app");
  el.innerHTML = screens[state.screen]();
  document.querySelector('nav[aria-label="Main"]').hidden = state.screen === "review" || state.screen === "drill";
  document.querySelectorAll(".nav-link").forEach(a => a.dataset.nav && a.dataset.nav === navOf[state.screen] ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.getElementById("screens").innerHTML = Object.keys(screens).map(s => `<button class="px-2 py-1 rounded ${s === state.screen ? "bg-neutral text-neutral-content font-semibold" : "hover:underline"}" onclick="go('${s}')">${screenNames[s]}</button>`).join("");
  document.getElementById("states").innerHTML = variants[state.screen].map(v => `<button class="px-2 py-1 rounded ${v === state.variant ? "bg-neutral text-neutral-content font-semibold" : "hover:underline"}" onclick="setVariant('${v}')">${v}</button>`).join("");
  if (window.lucide) lucide.createIcons();
}
function applyTheme(name, save = true) {
  document.documentElement.dataset.theme = name;
  document.querySelector('meta[name="theme-color"]').content = name === "studyapp-dark" ? "#18130e" : "#f9f4ee";
  document.querySelectorAll("[data-theme-choice]").forEach(b => b.setAttribute("aria-checked", b.dataset.themeChoice === name));
  if (save) { try { localStorage.setItem("studyapp-theme", name); } catch (e) {} render(); }
}
document.getElementById("theme-switch").addEventListener("click", e => { const b = e.target.closest("[data-theme-choice]"); if (b) applyTheme(b.dataset.themeChoice); });
(() => { let saved = null; try { saved = localStorage.getItem("studyapp-theme"); } catch (e) {} applyTheme(saved === "studyapp" ? "studyapp" : "studyapp-dark", false); })();
document.addEventListener("keydown", e => {
  if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  if (state.screen === "drill" && state.variant === "doing it" && /^[1-3]$/.test(e.key)) setVariant(e.key === "3" ? "rated solid" : "rated shaky");
});
const start = location.hash.slice(1);
if (screens[start]) state.screen = start, state.variant = variants[start][0];
render();
const strip = document.getElementById("proto-strip");
new ResizeObserver(() => document.documentElement.style.setProperty("--strip", strip.offsetHeight + "px")).observe(strip);
</script>
</body>
</html>
