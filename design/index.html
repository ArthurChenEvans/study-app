<!doctype html>
<html lang="en" data-theme="studyapp">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study App Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.43/daisyui.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  /* studyapp theme, same values as docs/design-rules.md */
  :root, [data-theme="studyapp"] {
    color-scheme: light;
    --color-base-100: oklch(97% 0.010 80);
    --color-base-200: oklch(94% 0.014 78);
    --color-base-300: oklch(89% 0.018 75);
    --color-base-content: oklch(27% 0.025 60);
    --color-primary: oklch(40% 0.065 50);
    --color-primary-content: oklch(97% 0.010 80);
    --color-secondary: oklch(32% 0.02 60);
    --color-secondary-content: oklch(94% 0.014 78);
    --color-accent: oklch(78% 0.13 78);
    --color-accent-content: oklch(27% 0.025 60);
    --color-neutral: oklch(32% 0.02 60);
    --color-neutral-content: oklch(94% 0.014 78);
    --color-info: oklch(50% 0.07 235);
    --color-info-content: oklch(97% 0.010 80);
    --color-success: oklch(50% 0.11 145);
    --color-success-content: oklch(97% 0.010 80);
    --color-warning: oklch(78% 0.13 78);
    --color-warning-content: oklch(27% 0.025 60);
    --color-error: oklch(50% 0.16 30);
    --color-error-content: oklch(97% 0.010 80);
    --radius-selector: 0.25rem;
    --radius-field: 0.375rem;
    --radius-box: 0.5rem;
    --size-selector: 0.25rem;
    --size-field: 0.25rem;
    --border: 1px;
    --depth: 0;
    --noise: 0;
  }
  body { background: var(--color-base-100); color: var(--color-base-content); font-family: "IBM Plex Sans", ui-sans-serif, sans-serif; }
  code, pre, .font-mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .input, .select, .textarea, .checkbox, .radio { border-color: oklch(58% 0.02 65); }
  :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  pre.shiki { padding: 12px 16px; border-radius: var(--radius-box); font-size: 14px; overflow-x: auto; }
  .divide-y > * { border-color: var(--color-base-300) !important; }
  .btn .kbd { background: transparent; border-color: currentColor; color: inherit; opacity: .8; }
  .open-q { border: 1px dashed oklch(50% 0.07 235); color: oklch(50% 0.07 235); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style type="text/tailwindcss">
  @theme {
    --color-muted: oklch(48% 0.022 65);
    --color-field-border: oklch(58% 0.02 65);
    --font-sans: "IBM Plex Sans", ui-sans-serif, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
</style>
</head>
<body class="min-h-screen">
<div class="flex min-h-screen">
  <!-- Navigation rail -->
  <nav class="w-56 shrink-0 bg-base-200 border-r border-base-300 flex flex-col p-3 gap-1" aria-label="Main">
    <div class="px-3 py-4 text-lg font-semibold">Study App</div>
    <a href="#topics" data-nav="topics" class="nav-link flex items-center gap-2 px-3 py-2 rounded-box text-sm"><i data-lucide="library" class="size-4"></i>Topics</a>
    <a href="#bibliography" data-nav="bibliography" class="nav-link flex items-center gap-2 px-3 py-2 rounded-box text-sm"><i data-lucide="book-open" class="size-4"></i>Bibliography</a>
    <a href="#setup" data-nav="setup" class="nav-link flex items-center gap-2 px-3 py-2 rounded-box text-sm"><i data-lucide="play" class="size-4"></i>New quiz</a>
    <a href="#history" data-nav="history" class="nav-link flex items-center gap-2 px-3 py-2 rounded-box text-sm"><i data-lucide="history" class="size-4"></i>History</a>
    <a href="#search" data-nav="search" class="nav-link flex items-center gap-2 px-3 py-2 rounded-box text-sm"><i data-lucide="search" class="size-4"></i>Search</a>
    <div class="mt-auto px-3 pt-6 text-xs text-muted">Design prototype. Screens and states are clickable, data is sample only.</div>
  </nav>
  <main id="app" class="flex-1 min-w-0"></main>
</div>

<!-- Prototype state switcher, not part of the app -->
<div class="fixed bottom-4 right-4 bg-neutral text-neutral-content rounded-box px-3 py-2 text-xs flex items-center gap-2 shadow-lg" aria-label="Prototype state">
  <span>State</span>
  <div id="states" class="flex gap-1"></div>
</div>

<script>
const icon = (name, cls = "size-4") => `<i data-lucide="${name}" class="${cls}"></i>`;
const openQ = (n, text) => `<span class="open-q inline-flex items-center gap-1 rounded-box px-2 py-0.5 text-xs" title="Open question ${n} in specs/README.md">${icon("circle-help","size-3")}Open Q${n}: ${text}</span>`;

const pipelineSvg = `<svg viewBox="0 0 360 80" class="w-full max-w-md" role="img" aria-label="Five stage pipeline: fetch, decode, execute, memory, write back">
  ${["Fetch","Decode","Execute","Memory","Write back"].map((s,i)=>`<g><rect x="${i*72+2}" y="20" width="66" height="40" rx="6" fill="oklch(94% 0.014 78)" stroke="oklch(58% 0.02 65)"/><text x="${i*72+35}" y="45" text-anchor="middle" font-size="11" font-family="IBM Plex Sans, sans-serif" fill="oklch(27% 0.025 60)">${s}</text></g>${i<4?`<path d="M${i*72+68} 40h4" stroke="oklch(48% 0.022 65)"/>`:""}`).join("")}
</svg>`;

const topics = [
  { name: "CPU", module: "Computer Architecture", tags: ["hardware","exam-1"], questions: 24, last: "2 days ago" },
  { name: "GPU", module: "Computer Architecture", tags: ["hardware"], questions: 18, last: "Today" },
  { name: "Memory hierarchy", module: "Computer Architecture", tags: ["exam-1"], questions: 12, last: "Never" },
  { name: "OSI model", module: "Networking", tags: ["networks"], questions: 15, last: "1 week ago" },
  { name: "Misc", module: null, tags: [], questions: 4, last: "Never" },
];

const sources = [
  { apa: "Patterson, D. A., & Hennessy, J. L. (2020). <i>Computer organization and design: The hardware/software interface</i> (RISC-V ed.). Morgan Kaufmann.", topics: ["CPU","GPU","Memory hierarchy"], cites: 31, author:"Patterson, D. A., & Hennessy, J. L.", year:"2020", title:"Computer organization and design" },
  { apa: "University College Isle of Man. (2026). <i>Lecture 3: The processor pipeline</i> [Lecture slides].", topics: ["CPU"], cites: 9, author:"University College Isle of Man", year:"2026", title:"Lecture 3: The processor pipeline" },
  { apa: "Kirk, D. B., & Hwu, W. W. (2022). <i>Programming massively parallel processors</i> (4th ed.). Morgan Kaufmann.", topics: ["GPU"], cites: 7, author:"Kirk, D. B., & Hwu, W. W.", year:"2022", title:"Programming massively parallel processors" },
];

const quizQuestions = [
  { topic: "CPU", text: "In the five-stage pipeline shown, which stage reads the register file?", img: true, options: ["Fetch","Decode","Execute","Write back"], correct: [1], multi: false, explain: "Operands are read from the register file during **decode**, while the instruction is being interpreted.", source: "Patterson & Hennessy (2020), p. 262" },
  { topic: "GPU", text: "Which of these describe how a GPU warp executes? Select all that apply.", options: ["All threads in the warp run the same instruction at once","Each thread has its own program counter in every case","Divergent branches are serialised","Warps are scheduled by the OS kernel"], correct: [0,2], multi: true, explain: "A warp runs in SIMT lockstep. When threads take different branches, the paths are run one after the other with inactive threads masked off.", source: "Kirk & Hwu (2022), p. 88" },
  { topic: "CPU", text: "A CPU has a clock rate of $3\\,\\text{GHz}$ and a CPI of $1.5$. How long do $6 \\times 10^{9}$ instructions take?", options: ["$2\\,\\text{s}$","$3\\,\\text{s}$","$4.5\\,\\text{s}$","$9\\,\\text{s}$"], correct: [1], multi: false, explain: "$T = \\dfrac{N \\times \\text{CPI}}{f} = \\dfrac{6\\times10^{9} \\times 1.5}{3\\times10^{9}} = 3\\,\\text{s}$", source: "Lecture 3, slide 14" },
  { topic: "GPU", text: "What does this CUDA kernel compute for each thread?", code: `__global__ void scale(float *data, float factor, int n) {\n    int index = blockIdx.x * blockDim.x + threadIdx.x;\n    if (index < n) {\n        data[index] = data[index] * factor;\n    }\n}`, options: ["Multiplies one element by factor","Sums the whole array","Copies data to host memory"], correct: [0], multi: false, explain: "Each thread works out its global index and scales one element, with a bounds check for the last block.", source: "Kirk & Hwu (2022), p. 41" },
];

const state = { screen: "topics", variant: "normal", quizIndex: 0, picked: new Set(), flagged: false, answered: false, mode: "study", optionCount: 4 };

const variants = {
  topics: ["normal","empty","delete"],
  editor: ["normal","error","no-file"],
  bibliography: ["normal","empty","add"],
  setup: ["normal","error"],
  quiz: ["study","exam","timer-low","incomplete"],
  results: ["normal","perfect"],
  history: ["normal","empty"],
  search: ["normal","no-results"],
};

function header(title, subtitle, actions = "") {
  return `<header class="flex items-end justify-between gap-6 px-12 pt-12 pb-8">
    <div><h1 class="text-3xl font-semibold leading-tight">${title}</h1>${subtitle ? `<p class="text-muted mt-2">${subtitle}</p>` : ""}</div>
    <div class="flex items-center gap-2">${actions}</div>
  </header>`;
}

/* ---------- Topics ---------- */
function screenTopics() {
  if (state.variant === "empty") {
    return header("Topics") + `<section class="px-12"><div class="max-w-md py-24">
      <h2 class="text-xl font-semibold">No topics yet</h2>
      <p class="text-muted mt-2">A topic holds your questions on one subject, like "CPU". You can group topics into modules later.</p>
      <button class="btn btn-primary mt-6">${icon("plus")}Create your first topic</button></div></section>`;
  }
  const groups = {};
  topics.forEach(t => { const k = t.module || "No module"; (groups[k] ||= []).push(t); });
  const rows = Object.entries(groups).map(([mod, list]) => `
    <h2 class="text-sm font-semibold text-muted mt-8 mb-2 flex items-center gap-2">${mod === "No module" ? icon("folder-open") : icon("folder")}${mod}</h2>
    <table class="table table-fixed">
      <colgroup><col class="w-[28%]"><col class="w-[30%]"><col class="w-[12%]"><col class="w-[15%]"><col class="w-[15%]"></colgroup>
      <thead><tr class="text-muted"><th>Topic</th><th>Tags</th><th class="text-right">Questions</th><th>Last quizzed</th><th></th></tr></thead>
      <tbody>${list.map(t => `<tr class="hover:bg-base-200">
        <td class="font-semibold"><a href="#editor" class="hover:underline">${t.name}</a></td>
        <td>${t.tags.map(g => `<span class="badge badge-ghost rounded-full text-xs">${g}</span>`).join(" ") || `<span class="text-muted text-sm">None</span>`}</td>
        <td class="text-right tabular-nums">${t.questions}</td>
        <td class="text-muted text-sm">${t.last}</td>
        <td class="text-right whitespace-nowrap"><a href="#editor" class="btn btn-ghost btn-sm">${icon("pencil")}Edit</a><button class="btn btn-ghost btn-sm" aria-label="Delete ${t.name}" onclick="setVariant('delete')">${icon("trash-2")}</button></td>
      </tr>`).join("")}</tbody>
    </table>`).join("");
  const dialog = state.variant === "delete" ? `<dialog open class="modal modal-open"><div class="modal-box max-w-md">
      <h3 class="text-lg font-semibold">Delete "CPU"?</h3>
      <p class="mt-2 text-muted">Its 24 questions will be removed from your topics. Past quiz attempts keep the questions as they were, so your history isn't affected.</p>
      <div class="modal-action"><button class="btn btn-ghost" onclick="setVariant('normal')">Cancel</button><button class="btn btn-error">Delete topic</button></div>
    </div></dialog>` : "";
  return header("Topics", "5 topics in 2 modules", `<button class="btn btn-ghost">${icon("folder-plus")}New module</button><button class="btn btn-primary">${icon("plus")}New topic</button>`) + `<section class="px-12 pb-16">${rows}</section>` + dialog;
}

/* ---------- Editor ---------- */
function filePreview() {
  if (state.variant === "no-file") {
    return `<div class="h-full flex flex-col items-start justify-center px-12 max-w-md">
      <h2 class="text-lg font-semibold">Open a file to read alongside</h2>
      <p class="text-muted mt-2 text-sm">Markdown, txt, PDF, PowerPoint or EPUB. Files are only shown here while you write, they aren't stored.</p>
      <button class="btn btn-outline mt-4">${icon("file-up")}Open file</button>
      <div class="mt-6">${openQ(1, "what happens when a file can't be opened")}</div></div>`;
  }
  return `<div class="flex items-center gap-1 px-3 pt-3 border-b border-base-300" role="tablist" aria-label="Open files">
      <button role="tab" aria-selected="true" class="px-3 py-2 text-sm border-b-2 border-primary font-semibold flex items-center gap-2">${icon("presentation")}lecture-3.pptx<span class="text-muted" aria-label="Close">${icon("x","size-3")}</span></button>
      <button role="tab" aria-selected="false" class="px-3 py-2 text-sm text-muted flex items-center gap-2">${icon("file-text")}patterson-ch4.pdf<span aria-label="Close">${icon("x","size-3")}</span></button>
      <button class="btn btn-ghost btn-xs ml-1" aria-label="Open another file">${icon("plus")}</button>
      <span class="ml-auto text-xs text-muted tabular-nums">Slide 12 of 40</span>
    </div>
    <div class="p-8 overflow-auto">
      <article class="bg-base-100 border border-base-300 rounded-box aspect-[16/9] p-10 max-w-2xl mx-auto">
        <p class="text-xs text-muted">Lecture 3 · The processor pipeline</p>
        <h2 class="text-2xl font-semibold mt-2">Five-stage RISC pipeline</h2>
        <div class="mt-6">${pipelineSvg}</div>
        <ul class="mt-6 space-y-2 text-sm list-disc pl-5">
          <li>Each stage takes one clock cycle</li>
          <li>Register operands are read in <b>decode</b></li>
          <li>Hazards stall the pipeline or need forwarding</li>
        </ul>
      </article>
      <p class="text-xs text-muted mt-3 text-center">PowerPoint is converted to PDF and rendered with PDF.js here. Text is selectable.</p>
    </div>`;
}

function optionRow(i, text, correct) {
  return `<div class="flex items-center gap-3">
    <input type="checkbox" class="checkbox checkbox-sm" ${correct ? "checked" : ""} aria-label="Option ${i + 1} is correct">
    <input class="input input-sm flex-1" value="${text}" aria-label="Option ${i + 1}">
    <button class="btn btn-ghost btn-sm" aria-label="Remove option ${i + 1}" ${state.optionCount <= 3 ? "disabled" : ""} onclick="state.optionCount--;render()">${icon("x")}</button>
  </div>`;
}

function screenEditor() {
  const err = state.variant === "error";
  const opts = ["Fetch","Decode","Execute","Write back","Memory"].slice(0, state.optionCount);
  return `<div class="flex h-screen">
    <section class="w-1/2 bg-base-200 border-r border-base-300 flex flex-col min-w-0" aria-label="Source preview">${filePreview()}</section>
    <section class="w-1/2 overflow-auto" aria-label="Question editor">
      <div class="px-10 pt-10 pb-6 flex items-end justify-between">
        <div><p class="text-sm text-muted">Computer Architecture / CPU</p><h1 class="text-2xl font-semibold mt-1">New question</h1></div>
        <span class="text-sm text-muted tabular-nums">24 questions in this topic</span>
      </div>
      <form class="px-10 pb-16 space-y-8 max-w-2xl" onsubmit="return false">
        <fieldset class="space-y-2">
          <label class="text-sm font-semibold" for="qtext">Question</label>
          <textarea id="qtext" class="textarea w-full font-mono text-sm" rows="3">In the five-stage pipeline shown, which stage reads the register file?\n\n![Pipeline](pipeline.png)</textarea>
          <p class="text-sm text-muted">Markdown, \`code\`, $LaTeX$ and images. Paste an image or <a class="link">pick a file</a>.</p>
        </fieldset>

        <fieldset class="space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-sm font-semibold">Answers</span>
            <div class="join" role="radiogroup" aria-label="Answer type">
              <button class="btn btn-sm join-item btn-neutral">Single</button><button class="btn btn-sm join-item btn-ghost border-field-border">Multiple</button>
            </div>
          </div>
          <div class="space-y-3">${opts.map((o, i) => optionRow(i, o, !err && i === 1)).join("")}</div>
          <div class="flex items-center gap-3">
            <button class="btn btn-ghost btn-sm" ${state.optionCount >= 5 ? "disabled" : ""} onclick="state.optionCount++;render()">${icon("plus")}Add option</button>
            <span class="text-sm text-muted">3 to 5 options. Tick the correct answer.</span>
          </div>
          ${err ? `<p class="text-sm text-error flex items-center gap-2" role="alert">${icon("circle-alert")}Mark at least one correct option before saving.</p>` : ""}
        </fieldset>

        <fieldset class="space-y-2">
          <label class="text-sm font-semibold" for="explain">Explanation</label>
          <textarea id="explain" class="textarea w-full font-mono text-sm" rows="3">Operands are read from the register file during **decode**, while the instruction is being interpreted.</textarea>
        </fieldset>

        <fieldset class="space-y-3">
          <span class="text-sm font-semibold">Sources <span class="font-normal text-muted">(optional)</span></span>
          <div class="flex items-center gap-3 text-sm">
            ${icon("book-open")}<span class="flex-1">Patterson & Hennessy (2020)</span>
            <input class="input input-sm w-28" value="p. 262" aria-label="Page">
            <button class="btn btn-ghost btn-sm" aria-label="Remove source">${icon("x")}</button>
          </div>
          <div class="flex items-center gap-3 text-sm">
            ${icon("book-open")}<span class="flex-1">Lecture 3: The processor pipeline (2026)</span>
            <input class="input input-sm w-28" value="slide 12" aria-label="Slide">
            <button class="btn btn-ghost btn-sm" aria-label="Remove source">${icon("x")}</button>
          </div>
          <button class="btn btn-ghost btn-sm">${icon("plus")}Cite a source</button>
        </fieldset>

        <fieldset class="space-y-2">
          <label class="text-sm font-semibold" for="tags">Tags</label>
          <div class="flex flex-wrap items-center gap-2"><span class="badge badge-ghost rounded-full">pipeline</span><span class="badge badge-ghost rounded-full">registers</span><input id="tags" class="input input-sm w-40" placeholder="Add a tag"></div>
        </fieldset>

        <div class="flex items-center gap-3 pt-4 border-t border-base-300">
          <button class="btn btn-primary" onclick="setVariant(state.variant==='error'?'normal':'error')">Save question</button>
          <button class="btn btn-ghost">Save and write another</button>
          <span class="ml-auto">${openQ(15, "switching multiple to single")}</span>
        </div>
      </form>
    </section>
  </div>`;
}

/* ---------- Bibliography ---------- */
function screenBibliography() {
  const actions = `<button class="btn btn-primary" onclick="setVariant('add')">${icon("plus")}Add source</button>`;
  if (state.variant === "empty") {
    return header("Bibliography") + `<section class="px-12"><div class="max-w-md py-24">
      <h2 class="text-xl font-semibold">No sources yet</h2>
      <p class="text-muted mt-2">Add the books, papers and lectures you write questions from, then cite them on each question.</p>
      <button class="btn btn-primary mt-6" onclick="setVariant('add')">${icon("plus")}Add your first source</button></div></section>`;
  }
  const add = state.variant === "add" ? `<dialog open class="modal modal-open"><div class="modal-box max-w-lg">
      <h3 class="text-lg font-semibold">Add source</h3>
      <form class="mt-6 space-y-4" onsubmit="return false">
        ${[["Author(s)","Kirk, D. B., & Hwu, W. W."],["Year","2022"],["Title","Programming massively parallel processors"],["Edition","4th"],["Publisher","Morgan Kaufmann"],["URL",""]].map(([l,v])=>`<label class="block"><span class="text-sm font-semibold">${l}</span><input class="input w-full mt-1" value="${v}"></label>`).join("")}
        <div class="bg-base-200 rounded-box p-4 text-sm"><p class="text-xs text-muted mb-1">APA preview</p>Kirk, D. B., & Hwu, W. W. (2022). <i>Programming massively parallel processors</i> (4th ed.). Morgan Kaufmann.</div>
        <div>${openQ(12, "which fields are required")}</div>
      </form>
      <div class="modal-action"><button class="btn btn-ghost" onclick="setVariant('normal')">Cancel</button><button class="btn btn-primary" onclick="setVariant('normal')">Add source</button></div>
    </div></dialog>` : "";
  return header("Bibliography", "3 sources, formatted in APA", actions) + `<section class="px-12 pb-16 max-w-5xl">
    <ul class="divide-y divide-base-300">${sources.map(s => `<li class="py-6 flex gap-8">
      <p class="flex-1 max-w-prose leading-relaxed pl-8 -indent-8">${s.apa}</p>
      <div class="w-56 shrink-0 text-sm"><p class="text-muted">Used by ${s.cites} questions in</p><p class="mt-1">${s.topics.join(", ")}</p></div>
      <button class="btn btn-ghost btn-sm self-start" aria-label="Edit source">${icon("pencil")}</button>
    </li>`).join("")}</ul>
    <div class="mt-6 flex gap-2">${openQ(10, "deleting a cited source")} ${openQ(11, "editing a cited source")}</div>
  </section>` + add;
}

/* ---------- Quiz setup ---------- */
function screenSetup() {
  const err = state.variant === "error";
  const seg = (name, opts, active) => `<div class="join" role="radiogroup" aria-label="${name}">${opts.map((o,i)=>`<button class="btn btn-sm join-item ${i===active?"btn-neutral":"btn-ghost border-field-border"}">${o}</button>`).join("")}</div>`;
  const row = (label, help, control) => `<div class="flex items-start justify-between gap-8 py-4 border-b border-base-300"><div><p class="font-semibold">${label}</p>${help?`<p class="text-sm text-muted mt-1">${help}</p>`:""}</div><div class="shrink-0">${control}</div></div>`;
  return header("New quiz", "Pick what to practise and how") + `<section class="px-12 pb-16 max-w-3xl">
    <h2 class="text-sm font-semibold text-muted mb-3">Topics</h2>
    <div class="space-y-1">${topics.slice(0,4).map((t,i)=>`<label class="flex items-center gap-3 py-2 px-3 rounded-box hover:bg-base-200 cursor-pointer">
      <input type="checkbox" class="checkbox checkbox-sm" ${!err && i<2?"checked":""}><span class="flex-1">${t.name} <span class="text-muted text-sm">· ${t.module}</span></span><span class="text-sm text-muted tabular-nums">${t.questions} questions</span></label>`).join("")}</div>
    ${err ? `<p class="text-sm text-error flex items-center gap-2 mt-3" role="alert">${icon("circle-alert")}Pick at least one topic to start.</p>` : `<p class="text-sm text-muted mt-3 tabular-nums">42 questions available</p>`}

    <h2 class="text-sm font-semibold text-muted mt-10 mb-1">Settings</h2>
    ${row("Mode","Study shows feedback after each question. Exam shows it at the end, and you can't go back.", seg("Mode",["Study","Exam"],0))}
    ${row("Questions","", `<div class="flex items-center gap-2">${seg("Amount",["All","Set number"],1)}<input class="input input-sm w-20 tabular-nums" value="20" aria-label="Number of questions"></div>`)}
    ${row("Pick","Random draws from all topics together. Even takes the same number from each.", seg("Pick",["Random","Even"],1))}
    ${row("Question order","", seg("Question order",["Keep","Shuffle"],1))}
    ${row("Option order","", seg("Option order",["Keep","Shuffle"],1))}
    ${row("Total timer","", `<div class="flex items-center gap-2"><input type="checkbox" class="toggle toggle-sm" checked aria-label="Use total timer"><input class="input input-sm w-20 tabular-nums" value="20" aria-label="Minutes"><span class="text-sm text-muted">min</span></div>`)}
    ${row("Per-question timer","Running out counts as wrong and moves on.", `<div class="flex items-center gap-2"><input type="checkbox" class="toggle toggle-sm" aria-label="Use per-question timer"><input class="input input-sm w-20 tabular-nums" value="45" disabled aria-label="Seconds"><span class="text-sm text-muted">sec</span></div>`)}
    ${row("Difficulty","Easy shows how many answers to pick on multiple-answer questions.", seg("Difficulty",["Easy","Hard"],1))}
    <div class="flex flex-wrap gap-2 mt-4">${openQ(2,"more questions than available")} ${openQ(3,"even split that doesn't divide")} ${openQ(4,"empty topics")}</div>
    <div class="mt-8"><a href="#quiz" class="btn btn-primary" onclick="${err?"setVariant('normal');return false":""}">${icon("play")}Start quiz</a></div>
  </section>`;
}

/* ---------- Quiz ---------- */
function renderMd(text) {
  return text.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
}
function screenQuiz() {
  const v = state.variant;
  state.mode = v === "exam" ? "exam" : "study";
  const q = v === "incomplete" ? quizQuestions[1] : quizQuestions[state.quizIndex % quizQuestions.length];
  const qi = v === "incomplete" ? 1 : state.quizIndex % quizQuestions.length;
  if (v === "incomplete" && !state.answered) { state.picked = new Set([0]); state.answered = true; }
  const low = v === "timer-low";
  const answered = state.answered && state.mode === "study";
  const isRight = answered && q.correct.length === state.picked.size && q.correct.every(c => state.picked.has(c));
  const partial = answered && !isRight && [...state.picked].every(p => q.correct.includes(p)) && state.picked.size > 0;
  const optionClass = (i) => {
    if (!answered) return state.picked.has(i) ? "border-primary bg-base-200" : "border-base-300 hover:bg-base-200";
    if (q.correct.includes(i)) return "border-success bg-base-200";
    if (state.picked.has(i)) return "border-error bg-base-200";
    return "border-base-300 opacity-70";
  };
  const optionMark = (i) => {
    if (!answered) return "";
    if (q.correct.includes(i)) return `<span class="text-success text-sm flex items-center gap-1 font-semibold">${icon("check")}Correct</span>`;
    if (state.picked.has(i)) return `<span class="text-error text-sm flex items-center gap-1 font-semibold">${icon("x")}Your pick</span>`;
    return "";
  };
  return `<div class="flex flex-col min-h-screen">
    <div class="flex items-center gap-6 px-12 py-4 border-b border-base-300">
      <span class="badge ${state.mode==="exam"?"badge-neutral":"badge-ghost"}">${state.mode === "exam" ? "Exam" : "Study"}</span>
      <span class="text-sm text-muted tabular-nums">Question ${qi + 7} of 20</span>
      <progress class="progress progress-primary w-48" value="${qi + 7}" max="20" aria-label="Progress"></progress>
      <span class="ml-auto flex items-center gap-2 tabular-nums font-semibold ${low ? "text-warning-content bg-warning px-3 py-1 rounded-box" : ""}" aria-live="polite">${icon("timer")}${low ? "0:58 left" : "12:40 left"}</span>
      <a href="#results" class="btn btn-ghost btn-sm">Quit</a>
    </div>
    <div class="flex-1 px-12 py-12">
      <div class="max-w-prose mx-auto">
        <p class="text-sm text-muted">${q.topic}${q.multi && state.mode==="study" && false ? "" : ""}</p>
        <h1 class="text-xl leading-snug mt-2 math">${q.text}</h1>
        ${q.img ? `<div class="mt-6">${pipelineSvg}</div>` : ""}
        ${q.code ? `<pre class="mt-6" data-code="cuda">${q.code.replace(/</g,"&lt;")}</pre>` : ""}
        ${q.multi ? `<p class="text-sm text-muted mt-4">Hard mode: the number of correct answers is hidden.</p>` : ""}
        <div class="mt-8 space-y-3" role="${q.multi ? "group" : "radiogroup"}">
          ${q.options.map((o, i) => `<button class="w-full min-h-11 text-left flex items-center gap-4 px-4 py-3 border rounded-box transition-colors duration-150 ${optionClass(i)}" onclick="pick(${i})" ${answered ? "disabled" : ""} aria-pressed="${state.picked.has(i)}">
            <kbd class="kbd kbd-sm tabular-nums">${i + 1}</kbd><span class="flex-1 math">${o}</span>${optionMark(i)}</button>`).join("")}
        </div>
        ${answered ? `<div class="mt-8 border-t border-base-300 pt-6" role="status">
          <p class="font-semibold flex items-center gap-2 ${isRight ? "text-success" : "text-error"}">${icon(isRight ? "circle-check" : "circle-x")}${isRight ? "Correct" : partial ? "Wrong: incomplete, you missed a correct option" : "Wrong"}${state.flagged ? `<span class="badge badge-warning ml-2">${icon("flag","size-3")}Guessed</span>` : ""}</p>
          <p class="mt-3 leading-relaxed math">${renderMd(q.explain)}</p>
          <p class="text-sm text-muted mt-3 flex items-center gap-2">${icon("book-open")}${q.source}</p>
          <p class="mt-3">${openQ(5, "should study mode show the explanation here")}</p>
        </div>` : ""}
        <div class="mt-8 flex items-center gap-3">
          ${answered ? `<button class="btn btn-primary" onclick="next()">Next question <kbd class="kbd kbd-xs">Enter</kbd></button>` :
            `<button class="btn btn-primary" onclick="submitAnswer()" ${state.picked.size ? "" : "disabled"}>Submit <kbd class="kbd kbd-xs">Enter</kbd></button>`}
          <button class="btn ${state.flagged ? "btn-warning" : "btn-ghost"}" onclick="toggleFlag()" aria-pressed="${state.flagged}">${icon("flag")}${state.flagged ? "Flagged as guessed" : "I guessed"} <kbd class="kbd kbd-xs">F</kbd></button>
          ${state.mode === "study" ? `<span class="ml-auto">${openQ(6,"going back in study mode")}</span>` : `<span class="ml-auto text-sm text-muted">No going back in exam mode</span>`}
        </div>
      </div>
    </div>
  </div>`;
}
function pick(i) {
  const q = quizQuestions[state.quizIndex % quizQuestions.length];
  if (state.answered && state.mode === "study") return;
  if (q.multi) { state.picked.has(i) ? state.picked.delete(i) : state.picked.add(i); }
  else state.picked = new Set([i]);
  render();
}
function submitAnswer() { if (!state.picked.size) return; if (state.mode === "exam") return next(); state.answered = true; render(); }
function next() { state.quizIndex++; state.picked = new Set(); state.answered = false; state.flagged = false; render(); }
function toggleFlag() { state.flagged = !state.flagged; render(); }

/* ---------- Results ---------- */
function screenResults() {
  const perfect = state.variant === "perfect";
  const reasons = ["Blank","Misremembered","Confused with something similar","Misread the question","Careless slip","Second-guessed","Never learned it"];
  const review = [
    { q: quizQuestions[1], status: "wrong", auto: "Incomplete", yours: "All threads in the warp run the same instruction at once" },
    { q: quizQuestions[2], status: "wrong", auto: null, yours: "$4.5\\,\\text{s}$" },
    { q: quizQuestions[0], status: "guessed", yours: "Decode" },
    { q: quizQuestions[3], status: "right", yours: "Multiplies one element by factor" },
  ];
  const statusBadge = s => s === "wrong" ? `<span class="text-error font-semibold flex items-center gap-1 text-sm">${icon("circle-x")}Wrong</span>` : s === "guessed" ? `<span class="font-semibold flex items-center gap-1 text-sm">${icon("flag")}Right, guessed</span>` : `<span class="text-success font-semibold flex items-center gap-1 text-sm">${icon("circle-check")}Right</span>`;
  const items = (perfect ? review.slice(3) : review).map(r => `<li class="py-6">
    <div class="flex items-start gap-6">
      <div class="flex-1 max-w-prose">
        <p class="text-sm text-muted">${r.q.topic}</p>
        <p class="mt-1 font-semibold math">${r.q.text}</p>
        <p class="mt-3 text-sm"><span class="text-muted">Your answer:</span> <span class="math">${r.yours}</span></p>
        <p class="text-sm"><span class="text-muted">Correct:</span> <span class="math">${r.q.correct.map(c => r.q.options[c]).join(", ")}</span></p>
        <p class="mt-3 text-sm leading-relaxed math">${renderMd(r.q.explain)}</p>
      </div>
      <div class="w-64 shrink-0">${statusBadge(r.status)}
        ${r.status === "wrong" ? (r.auto ? `<p class="text-sm mt-3">Reason: <b>${r.auto}</b> <span class="text-muted">(recorded automatically)</span></p>` :
          `<label class="block mt-3"><span class="text-sm text-muted">Why did you get it wrong? <span class="text-xs">(optional)</span></span>
            <select class="select select-sm w-full mt-1"><option>Pick a reason</option>${reasons.map(x=>`<option>${x}</option>`).join("")}<option>Other (write it)</option></select></label>
            <input class="input input-sm w-full mt-2" placeholder="Or write your own reason">`) : ""}
      </div>
    </div></li>`).join("");
  return header("Results", "CPU + GPU · Study mode · 20 questions · 14 min", "") + `<section class="px-12 pb-16 max-w-5xl">
    <div class="flex items-end gap-16">
      <div><p class="text-4xl font-semibold leading-tight tabular-nums">${perfect ? "20 / 20" : "16 / 20"}</p><p class="text-muted mt-1">${perfect ? "None guessed" : "3 of those guessed"}</p></div>
      <table class="table table-sm w-auto">
        <thead><tr class="text-muted"><th>Topic</th><th class="text-right">Right</th><th class="text-right">Guessed</th></tr></thead>
        <tbody><tr><td>CPU</td><td class="text-right tabular-nums">${perfect?"10 / 10":"9 / 10"}</td><td class="text-right tabular-nums">${perfect?0:1}</td></tr>
        <tr><td>GPU</td><td class="text-right tabular-nums">${perfect?"10 / 10":"7 / 10"}</td><td class="text-right tabular-nums">${perfect?0:2}</td></tr></tbody>
      </table>
      <div class="ml-auto">${perfect ? `<p class="text-sm text-muted">Nothing to retry, every answer was right and none guessed.</p>` :
        `<a href="#quiz" class="btn btn-primary">${icon("rotate-ccw")}Retry 7 questions</a><p class="text-xs text-muted mt-2">4 wrong + 3 guessed, same settings</p>`}</div>
    </div>
    <div class="mt-4">${openQ(7, "do wrong guesses count in \"guessed\"")}</div>
    <h2 class="text-lg font-semibold mt-12">Review</h2>
    <p class="text-sm text-muted">Wrong and guessed questions first.</p>
    <ul class="divide-y divide-base-300 mt-2">${items}</ul>
  </section>`;
}

/* ---------- History ---------- */
function screenHistory() {
  if (state.variant === "empty") {
    return header("History") + `<section class="px-12"><div class="max-w-md py-24"><h2 class="text-xl font-semibold">No quizzes yet</h2>
      <p class="text-muted mt-2">Every quiz you finish or quit is saved here.</p><a href="#setup" class="btn btn-primary mt-6">${icon("play")}Start a quiz</a></div></section>`;
  }
  const rows = [
    ["Today 15:12","CPU, GPU","Study","16 / 20","3", ""],
    ["Today 15:31","CPU, GPU","Study","6 / 7","1", "Retry"],
    ["Yesterday","Memory hierarchy","Exam","8 / 12","0", ""],
    ["29 Oct","OSI model","Exam","4 / 15","2", "Incomplete"],
  ];
  return header("History", "4 attempts") + `<section class="px-12 pb-16 max-w-5xl">
    <table class="table">
      <thead><tr class="text-muted"><th>Date</th><th>Topics</th><th>Mode</th><th class="text-right">Score</th><th class="text-right">Guessed</th><th></th><th></th></tr></thead>
      <tbody>${rows.map(r => `<tr class="hover:bg-base-200"><td class="tabular-nums">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="text-right tabular-nums font-semibold">${r[3]}</td><td class="text-right tabular-nums">${r[4]}</td>
        <td>${r[5] === "Retry" ? `<span class="badge badge-ghost">${icon("rotate-ccw","size-3")}Retry</span>` : r[5] === "Incomplete" ? `<span class="badge badge-ghost">${icon("circle-pause","size-3")}Incomplete</span>` : ""}</td>
        <td class="text-right"><a href="#results" class="btn btn-ghost btn-sm">View</a></td></tr>`).join("")}</tbody>
    </table>
    <div class="mt-4 flex gap-2">${openQ(8, "retrying a retry")} ${openQ(13, "resuming an incomplete attempt")}</div>
  </section>`;
}

/* ---------- Search ---------- */
function screenSearch() {
  const none = state.variant === "no-results";
  const tabs = ["All","Modules","Topics","Tags","Sources"];
  const results = [
    ["What is a shader core?", "GPU", "hardware, shaders", "Today"],
    ["Which of these describe how a GPU warp executes?", "GPU", "hardware", "Today"],
    ["In the five-stage pipeline shown, which stage reads the register file?", "CPU", "pipeline, registers", "2 days ago"],
  ];
  return header("Search") + `<section class="px-12 pb-16 max-w-5xl">
    <label class="input w-full flex items-center gap-2">${icon("search")}<input type="search" class="grow" value="${none ? "tensor core" : "hardware"}" aria-label="Search" autofocus></label>
    <div class="flex items-center gap-1 mt-6 border-b border-base-300" role="tablist">${tabs.map((t,i)=>`<button role="tab" aria-selected="${i===0}" class="px-3 py-2 text-sm ${i===0?"border-b-2 border-primary font-semibold":"text-muted"}">${t}${i===0&&!none?` <span class="text-muted font-normal tabular-nums">3</span>`:""}</button>`).join("")}</div>
    <div class="flex flex-wrap items-center gap-2 mt-4">
      <span class="text-sm text-muted">Filters</span>
      <span class="badge badge-ghost gap-1">Module: Computer Architecture <button aria-label="Remove filter">${icon("x","size-3")}</button></span>
      <span class="badge badge-ghost gap-1">Tag: hardware <button aria-label="Remove filter">${icon("x","size-3")}</button></span>
      <button class="btn btn-ghost btn-xs">${icon("plus")}Add filter</button>
      <span class="ml-auto">${openQ(16, "which tab questions appear under")}</span>
    </div>
    ${none ? `<div class="py-16 max-w-md"><h2 class="text-lg font-semibold">No matches for "tensor core"</h2><p class="text-muted mt-2">Try fewer words, or remove a filter.</p><button class="btn btn-ghost mt-4">Clear filters</button></div>` :
    `<table class="table mt-4">
      <thead><tr class="text-muted"><th><button class="flex items-center gap-1">Question ${icon("arrow-up-down","size-3")}</button></th><th><button class="flex items-center gap-1">Topic ${icon("arrow-up-down","size-3")}</button></th><th>Tags</th><th><button class="flex items-center gap-1">Edited ${icon("arrow-down","size-3")}</button></th></tr></thead>
      <tbody>${results.map(r=>`<tr class="hover:bg-base-200"><td class="max-w-md">${r[0]}</td><td>${r[1]}</td><td class="text-sm text-muted">${r[2]}</td><td class="text-sm text-muted">${r[3]}</td></tr>`).join("")}</tbody>
    </table>`}
  </section>`;
}

const screens = { topics: screenTopics, editor: screenEditor, bibliography: screenBibliography, setup: screenSetup, quiz: screenQuiz, results: screenResults, history: screenHistory, search: screenSearch };

function setVariant(v) { state.variant = v; state.picked = new Set(); state.answered = false; state.flagged = false; render(); }

function render() {
  const el = document.getElementById("app");
  el.innerHTML = screens[state.screen]();
  document.querySelectorAll(".nav-link").forEach(a => {
    const on = a.dataset.nav === state.screen || (state.screen === "editor" && a.dataset.nav === "topics") || (["quiz","results"].includes(state.screen) && a.dataset.nav === "setup");
    a.classList.toggle("bg-base-300", on); a.classList.toggle("font-semibold", on);
    a.setAttribute("aria-current", on ? "page" : "false");
  });
  document.getElementById("states").innerHTML = variants[state.screen].map(v => `<button class="px-2 py-1 rounded ${v === state.variant ? "bg-neutral-content text-neutral font-semibold" : "hover:underline"}" onclick="setVariant('${v}')">${v}</button>`).join("");
  if (window.lucide) lucide.createIcons();
  if (window.renderMathInElement) renderMathInElement(el, { delimiters: [{ left: "$", right: "$", display: false }], throwOnError: false });
  highlight();
}

let highlighter;
async function highlight() {
  const blocks = document.querySelectorAll("pre[data-code]");
  if (!blocks.length) return;
  try {
    if (!highlighter) {
      const shiki = await import("https://cdn.jsdelivr.net/npm/shiki@1.22.2/+esm");
      highlighter = await shiki.createHighlighter({ themes: ["min-light"], langs: ["cpp"] });
    }
    blocks.forEach(b => { b.outerHTML = highlighter.codeToHtml(b.textContent, { lang: "cpp", theme: "min-light" }); });
  } catch (e) { blocks.forEach(b => b.classList.add("bg-base-200","p-4","rounded-box","text-sm","font-mono")); }
}

function route() {
  const s = location.hash.slice(1) || "topics";
  state.screen = screens[s] ? s : "topics";
  state.variant = variants[state.screen][0];
  state.picked = new Set(); state.answered = false; state.flagged = false; state.quizIndex = 0;
  render();
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => {
  if (state.screen !== "quiz" || ["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)) return;
  const q = quizQuestions[state.quizIndex % quizQuestions.length];
  if (/^[1-5]$/.test(e.key) && Number(e.key) <= q.options.length) pick(Number(e.key) - 1);
  else if (e.key === "Enter") { e.preventDefault(); state.answered ? next() : submitAnswer(); }
  else if (e.key.toLowerCase() === "f") toggleFlag();
});
route();
</script>
</body>
</html>
