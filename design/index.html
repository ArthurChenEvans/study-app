<style>
  /* studyapp theme, same values as docs/design-rules.md */
  :root, [data-theme="studyapp"] {
    color-scheme: light;
    --color-base-100: oklch(97% 0.010 80);
    --color-base-200: oklch(94% 0.014 78);
    --color-base-300: oklch(89% 0.018 75);
    --color-base-content: oklch(27% 0.025 60);
    --color-primary: oklch(40% 0.065 50);
    --color-primary-content: oklch(97% 0.010 80);
    --color-secondary: oklch(32% 0.02 60);
    --color-secondary-content: oklch(94% 0.014 78);
    --color-accent: oklch(78% 0.13 78);
    --color-accent-content: oklch(27% 0.025 60);
    --color-neutral: oklch(32% 0.02 60);
    --color-neutral-content: oklch(94% 0.014 78);
    --color-info: oklch(44% 0.07 235);
    --color-info-content: oklch(97% 0.010 80);
    --color-success: oklch(42% 0.11 145);
    --color-success-content: oklch(97% 0.010 80);
    --color-warning: oklch(78% 0.13 78);
    --color-warning-content: oklch(27% 0.025 60);
    --color-error: oklch(44% 0.15 30);
    --color-error-content: oklch(97% 0.010 80);
    --radius-selector: 0.25rem;
    --radius-field: 0.375rem;
    --radius-box: 0.5rem;
    --size-selector: 0.25rem;
    --size-field: 0.25rem;
    --border: 1px;
    --depth: 0;
    --noise: 0;

    /* Raised surface for panels, and chart tokens (validated, see design rules) */
    --surface: oklch(99% 0.006 80);
    /* Quiz outcomes: blue / orange pair, colour-blind safe; guessed = hatched right */
    --chart-right: #025884;
    --chart-wrong: #cc6c13;
    --right-ink: #004d77;
    --wrong-ink: #853900;
    --guessed-tint: #c1dcf0;
    --guessed-ink: #013658;
    --guessed-fill: repeating-linear-gradient(135deg, #025884 0 2px, #c1dcf0 2px 6px);
    --chart-ink: #643d26;
    --chart-grid: oklch(91% 0.016 76);
    --muted: oklch(42% 0.022 65);
    --shadow-panel: 0 1px 2px oklch(27% 0.025 60 / .06), 0 6px 16px oklch(27% 0.025 60 / .05);
    --shadow-soft: 0 1px 2px oklch(27% 0.025 60 / .08);
    --field-border: oklch(58% 0.02 65);
    --on-right: #fff;
    --on-wrong: #140d08;
    --diagram-fill: oklch(94% 0.014 78);
  }
  /* Dark theme: its own palette, validated against the dark panel surface (see design rules) */
  [data-theme="studyapp-dark"] {
    color-scheme: dark;
    --color-base-100: oklch(19% 0.012 65);
    --color-base-200: oklch(16% 0.012 65);
    --color-base-300: oklch(32% 0.016 65);
    --color-base-content: oklch(93% 0.012 80);
    --color-primary: oklch(74% 0.10 62);
    --color-primary-content: oklch(18% 0.012 65);
    --color-secondary: oklch(88% 0.015 75);
    --color-secondary-content: oklch(18% 0.012 65);
    --color-accent: oklch(80% 0.13 80);
    --color-accent-content: oklch(18% 0.012 65);
    --color-neutral: oklch(88% 0.015 75);
    --color-neutral-content: oklch(18% 0.012 65);
    --color-info: oklch(76% 0.08 235);
    --color-info-content: oklch(18% 0.012 65);
    --color-success: oklch(76% 0.13 145);
    --color-success-content: oklch(18% 0.012 65);
    --color-warning: oklch(80% 0.13 80);
    --color-warning-content: oklch(18% 0.012 65);
    --color-error: oklch(76% 0.13 30);
    --color-error-content: oklch(18% 0.012 65);
    --radius-selector: 0.25rem; --radius-field: 0.375rem; --radius-box: 0.5rem;
    --size-selector: 0.25rem; --size-field: 0.25rem; --border: 1px; --depth: 0; --noise: 0;

    --surface: oklch(23% 0.014 65);
    --chart-right: #0573aa;
    --chart-wrong: #d67523;
    --right-ink: #87c6f2;
    --wrong-ink: #f9b379;
    --guessed-tint: #163c54;
    --guessed-ink: #bbddf6;
    --guessed-fill: repeating-linear-gradient(135deg, #0573aa 0 2px, #163c54 2px 6px);
    --chart-ink: oklch(74% 0.10 62);
    --chart-grid: oklch(30% 0.014 65);
    --muted: oklch(78% 0.016 75);
    --field-border: oklch(52% 0.018 70);
    --on-right: #fff;
    --on-wrong: #140d08;
    --diagram-fill: oklch(28% 0.014 65);
    --shadow-panel: 0 1px 0 oklch(100% 0 0 / .04) inset, 0 1px 2px oklch(0% 0 0 / .4), 0 8px 24px oklch(0% 0 0 / .25);
    --shadow-soft: 0 1px 2px oklch(0% 0 0 / .4);
  }
  body { background: var(--color-base-100); color: var(--color-base-content); font-family: "IBM Plex Sans", ui-sans-serif, sans-serif; }
  code, pre, .font-mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  h1, h2 { text-wrap: balance; }
  h1 { letter-spacing: -0.015em; }
  .input, .select, .textarea, .checkbox, .radio { border-color: var(--field-border); }
  .input, .select, .textarea { background: var(--surface); }
  :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  pre.shiki { padding: 12px 16px; border-radius: var(--radius-box); font-size: 14px; overflow-x: auto; border: 1px solid var(--color-base-300); }
  .divide-y > * { border-color: var(--color-base-300) !important; }
  .btn .kbd { background: transparent; border-color: currentColor; color: inherit; opacity: .8; }
  .btn { transition: transform 120ms ease-out, background-color 150ms ease-out, box-shadow 150ms ease-out; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn-primary { box-shadow: 0 1px 2px oklch(27% 0.025 60 / .25), inset 0 1px 0 oklch(100% 0 0 / .12); }

  /* Panels: the one raised surface. Used for groups you read as a unit (charts, summaries) */
  .panel { background: var(--surface); border: 1px solid var(--color-base-300); border-radius: 12px; box-shadow: var(--shadow-panel); }
  .eyebrow { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  /* Segmented control */
  .seg { display: inline-flex; align-items: stretch; height: 2rem; padding: 2px; gap: 2px; border: 1px solid var(--field-border); border-radius: var(--radius-field); background: var(--color-base-200); vertical-align: middle; }
  .seg > button { padding: 0 12px; font-size: 14px; line-height: 1; border-radius: calc(var(--radius-field) - 2px); color: var(--muted); transition: background-color 150ms ease-out, color 150ms ease-out; }
  .seg > button:hover:not([aria-checked="true"]) { background: var(--color-base-300); color: var(--color-base-content); }
  .seg > button[aria-checked="true"] { background: var(--color-neutral); color: var(--color-neutral-content); font-weight: 600; }
  .seg > button:focus-visible { outline-offset: 1px; }
  /* Fields: one focus ring */
  .input:focus, .input:focus-within, .select:focus, .textarea:focus { outline: none !important; border-color: var(--color-primary) !important; box-shadow: 0 0 0 1px var(--color-primary) !important; }
  label.input input:focus, label.input input:focus-visible { outline: none !important; box-shadow: none !important; }
  .input-sm, .seg { min-height: 2rem; }
  .btn:disabled .kbd { opacity: .5; }
  .toggle:checked { background-color: var(--color-primary); border-color: var(--color-primary); color: var(--color-primary-content); }
  [role=tab] .count { font-size: 12px; margin-left: 4px; color: var(--muted); font-weight: 400; }
  .open-q { border: 1px dashed var(--color-info); color: var(--color-info); background: var(--surface); }

  /* Navigation */
  .nav-link { color: var(--muted); transition: background-color 150ms ease-out, color 150ms ease-out; }
  .nav-link:hover { background: var(--color-base-300); color: var(--color-base-content); }
  .nav-link[aria-current="page"] { background: var(--surface); color: var(--color-base-content); font-weight: 600; box-shadow: var(--shadow-soft); }

  /* Charts */
  .seg-bar { display: flex; gap: 2px; border-radius: 999px; overflow: hidden; }
  .seg-bar > span { display: block; height: 100%; }
  .tall-bar { display: flex; gap: 2px; height: 28px; }
  .tall-bar > span { border-radius: 4px; display: flex; align-items: center; padding-left: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: visible; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .text-right-ink { color: var(--right-ink); } .text-wrong-ink { color: var(--wrong-ink); }
  .is-right { border-color: var(--chart-right) !important; box-shadow: 0 0 0 1px var(--chart-right); }
  .is-wrong { border-color: var(--chart-wrong) !important; box-shadow: 0 0 0 1px var(--chart-wrong); }
  .guessed-chip { background: var(--guessed-tint); color: var(--guessed-ink); border-color: var(--guessed-tint); }
  .hbar { height: 12px; border-radius: 0 4px 4px 0; background: var(--chart-ink); transition: width 400ms ease-out; }
  .cell { width: 24px; height: 24px; border-radius: 4px; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #fff; }
  .chart-tip { position: fixed; pointer-events: none; z-index: 50; background: var(--color-neutral); color: var(--color-neutral-content); font-size: 12px; line-height: 1.4; padding: 8px 10px; border-radius: 6px; box-shadow: 0 4px 12px oklch(27% 0.025 60 / .2); opacity: 0; transition: opacity 120ms ease-out; max-width: 240px; }
  .chart-tip.show { opacity: 1; }
  details.table-view summary { cursor: pointer; font-size: 12px; color: var(--muted); }

  /* Quiz progress track */
  .track { display: flex; gap: 2px; height: 6px; }
  .track > span { flex: 1; border-radius: 2px; background: var(--color-base-300); }

  /* Motion */
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise 260ms ease-out both; }
  .rise-2 { animation-delay: 60ms; } .rise-3 { animation-delay: 120ms; } .rise-4 { animation-delay: 180ms; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
<style type="text/tailwindcss">
  @theme {
    --color-muted: var(--muted);
    --color-field-border: var(--field-border);
    --color-surface: var(--surface);
    --font-sans: "IBM Plex Sans", ui-sans-serif, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
</style>

<div class="flex min-h-screen">
  <nav class="w-60 shrink-0 bg-base-200 border-r border-base-300 flex flex-col p-3 gap-1 sticky top-0 h-screen" aria-label="Main">

<div class="fixed bottom-4 right-4 bg-neutral text-neutral-content rounded-lg px-3 py-2 text-xs flex items-center gap-2 shadow-lg z-40" aria-label="Prototype state">
  <span class="opacity-70">State</span>
  <div id="states" class="flex gap-1"></div>

<script>
/* ---------------- Helpers ---------------- */
const icon = (name, cls = "size-4") => `<i data-lucide="${name}" class="${cls}"></i>`;
const openQ = (n, text) => `<span class="open-q inline-flex items-center gap-1 rounded-md px-2 py-0.5 text-xs" title="Open question ${n} in specs/README.md">${icon("circle-help","size-3")}Open Q${n}: ${text}</span>`;
const pct = (a, b) => Math.round(a / b * 100);
const STATUS = {
  right:   { label: "Right",   color: "var(--chart-right)",  glyph: "✓", text: "var(--on-right)" },
  guessed: { label: "Guessed", color: "var(--guessed-fill)", glyph: "?", text: "var(--guessed-ink)" },
  wrong:   { label: "Wrong",   color: "var(--chart-wrong)",  glyph: "✕", text: "var(--on-wrong)" },
};
const legend = (keys = ["right","guessed","wrong"]) => `<div class="flex items-center gap-4 text-xs text-muted">${keys.map(k => `<span class="flex items-center gap-1.5"><span class="swatch" style="background:${STATUS[k].color}"></span>${k === "right" ? "Right, sure" : k === "guessed" ? "Right, guessed" : "Wrong"}</span>`).join("")}</div>`;

/* Thin segmented bar: right (sure) / guessed / wrong */
function segBar(r, g, w, h = 8) {
  const total = r + g + w;
  const parts = [["right", r], ["guessed", g], ["wrong", w]].filter(p => p[1] > 0);
  return `<div class="seg-bar" style="height:${h}px" role="img" aria-label="${r} right and sure, ${g} guessed, ${w} wrong">${parts.map(([k, v]) =>
    `<span data-tip="${k === "right" ? "Right, sure" : k === "guessed" ? "Right, guessed" : "Wrong"}: ${v} of ${total} (${pct(v, total)}%)" style="width:${v / total * 100}%;background:${STATUS[k].color}"></span>`).join("")}</div>`;
}
/* Tall segmented bar with labels inside when they fit */
function tallBar(r, g, w) {
  const total = r + g + w;
  return `<div class="tall-bar" role="img" aria-label="${r} right and sure, ${g} guessed, ${w} wrong out of ${total}">${[["right", r], ["guessed", g], ["wrong", w]].filter(p => p[1]).map(([k, v]) =>
    `<span data-tip="${k === "right" ? "Right, sure" : k === "guessed" ? "Right, guessed" : "Wrong"}: ${v} of ${total}" style="width:${v / total * 100}%;background:${STATUS[k].color};color:${STATUS[k].text}">${v / total > 0.1 ? (k === "guessed" ? `<span class="px-1.5 rounded" style="background:var(--surface)">${v}</span>` : v) : ""}</span>`).join("")}</div>`;
}
/* Ranked horizontal bars, one series */
function hbars(rows, unit = "") {
  const max = Math.max(...rows.map(r => r[1]));
  return `<div class="space-y-3">${rows.map(([label, v, note]) => `<div class="grid grid-cols-[220px_1fr] items-center gap-4 text-sm" data-tip="${label}: ${v}${unit}${note ? " · " + note : ""}">
    <span class="truncate">${label}</span>
    <span class="flex items-center gap-2"><span class="hbar" style="width:${Math.max(v / max * 100, 2)}%"></span><span class="tabular-nums text-muted text-xs">${v}${unit}</span></span></div>`).join("")}</div>`;
}
const tableView = (head, rows) => `<details class="table-view mt-4"><summary>Show as table</summary>
  <table class="table table-xs mt-2"><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td class="tabular-nums">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></details>`;

/* ---------------- Sample data ---------------- */
const pipelineSvg = `<svg viewBox="0 0 360 80" class="w-full max-w-md" role="img" aria-label="Five stage pipeline: fetch, decode, execute, memory, write back">
  ${["Fetch","Decode","Execute","Memory","Write back"].map((s,i)=>`<g><rect x="${i*72+2}" y="20" width="66" height="40" rx="6" style="fill:var(--diagram-fill);stroke:var(--field-border)"/><text x="${i*72+35}" y="45" text-anchor="middle" font-size="11" font-family="IBM Plex Sans, sans-serif" style="fill:var(--color-base-content)">${s}</text></g>${i<4?`<path d="M${i*72+68} 40h4" style="stroke:var(--muted)"/>`:""}`).join("")}
</svg>`;

const topics = [
  { name: "CPU", module: "Computer Architecture", tags: ["hardware","exam-1"], questions: 24, last: "Today", r: 14, g: 3, w: 3 },
  { name: "GPU", module: "Computer Architecture", tags: ["hardware"], questions: 18, last: "Today", r: 9, g: 4, w: 5 },
  { name: "Memory hierarchy", module: "Computer Architecture", tags: ["exam-1"], questions: 12, last: "Yesterday", r: 6, g: 2, w: 4 },
  { name: "OSI model", module: "Networking", tags: ["networks"], questions: 15, last: "29 Oct", r: 3, g: 1, w: 11 },
  { name: "Misc", module: null, tags: [], questions: 4, last: null },
];

/* Attempts, oldest first. right includes guessed */
const attempts = [
  { date: "12 Oct", topics: "CPU", mode: "Study", total: 15, right: 8, guessed: 3 },
  { date: "14 Oct", topics: "CPU", mode: "Study", total: 15, right: 9, guessed: 2 },
  { date: "16 Oct", topics: "OSI model", mode: "Exam", total: 15, right: 7, guessed: 2 },
  { date: "18 Oct", topics: "CPU, GPU", mode: "Study", total: 20, right: 12, guessed: 4 },
  { date: "20 Oct", topics: "CPU, GPU", mode: "Study", total: 6, right: 5, guessed: 1, retry: true },
  { date: "22 Oct", topics: "GPU", mode: "Exam", total: 18, right: 11, guessed: 3 },
  { date: "24 Oct", topics: "Memory hierarchy", mode: "Study", total: 12, right: 7, guessed: 2 },
  { date: "26 Oct", topics: "CPU, GPU", mode: "Exam", total: 20, right: 13, guessed: 2 },
  { date: "29 Oct", topics: "OSI model", mode: "Exam", total: 15, right: 4, guessed: 1, incomplete: true },
  { date: "31 Oct", topics: "Memory hierarchy", mode: "Exam", total: 12, right: 8, guessed: 2 },
  { date: "1 Nov", topics: "CPU, GPU", mode: "Study", total: 20, right: 16, guessed: 3 },
  { date: "1 Nov", topics: "CPU, GPU", mode: "Study", total: 7, right: 6, guessed: 1, retry: true },
];

const reasons = [
  ["Confused with something similar", 14], ["Misremembered", 11], ["Blank", 7], ["Incomplete (auto)", 6],
  ["Misread the question", 4], ["Timed out (auto)", 3], ["Careless slip", 2], ["Second-guessed", 2], ["Never learned it", 1],
];

const sources = [
  { apa: "Patterson, D. A., & Hennessy, J. L. (2020). <i>Computer organization and design: The hardware/software interface</i> (RISC-V ed.). Morgan Kaufmann.", topics: ["CPU","GPU","Memory hierarchy"], cites: 31 },
  { apa: "University College Isle of Man. (2026). <i>Lecture 3: The processor pipeline</i> [Lecture slides].", topics: ["CPU"], cites: 9 },
  { apa: "Kirk, D. B., & Hwu, W. W. (2022). <i>Programming massively parallel processors</i> (4th ed.). Morgan Kaufmann.", topics: ["GPU"], cites: 7 },
];

const quizQuestions = [
  { topic: "CPU", text: "In the five-stage pipeline shown, which stage reads the register file?", img: true, options: ["Fetch","Decode","Execute","Write back"], correct: [1], multi: false, explain: "Operands are read from the register file during **decode**, while the instruction is being interpreted.", source: "Patterson & Hennessy (2020), p. 262" },
  { topic: "GPU", text: "Which of these describe how a GPU warp executes? Select all that apply.", options: ["All threads in the warp run the same instruction at once","Each thread has its own program counter in every case","Divergent branches are serialised","Warps are scheduled by the OS kernel"], correct: [0,2], multi: true, explain: "A warp runs in SIMT lockstep. When threads take different branches, the paths are run one after the other with inactive threads masked off.", source: "Kirk & Hwu (2022), p. 88" },
  { topic: "CPU", text: "A CPU has a clock rate of $3\\,\\text{GHz}$ and a CPI of $1.5$. How long do $6 \\times 10^{9}$ instructions take?", options: ["$2\\,\\text{s}$","$3\\,\\text{s}$","$4.5\\,\\text{s}$","$9\\,\\text{s}$"], correct: [1], multi: false, explain: "$T = \\dfrac{N \\times \\text{CPI}}{f} = \\dfrac{6\\times10^{9} \\times 1.5}{3\\times10^{9}} = 3\\,\\text{s}$", source: "Lecture 3, slide 14" },
  { topic: "GPU", text: "What does this CUDA kernel compute for each thread?", code: `__global__ void scale(float *data, float factor, int n) {\n    int index = blockIdx.x * blockDim.x + threadIdx.x;\n    if (index < n) {\n        data[index] = data[index] * factor;\n    }\n}`, options: ["Multiplies one element by factor","Sums the whole array","Copies data to host memory"], correct: [0], multi: false, explain: "Each thread works out its global index and scales one element, with a bounds check for the last block.", source: "Kirk & Hwu (2022), p. 41" },
];

/* The finished quiz shown on Results: 20 questions in order */

  const answered = last7.reduce((s, a) => s + a.total, 0);

  const weakest = topics.filter(t => t.last).sort((a, b) => (a.r + a.g) / (a.r + a.g + a.w) - (b.r + b.g) / (b.r + b.g + b.w));

    </div>
    <div class="panel p-6 rise rise-2">

      <p class="mt-3 text-sm text-muted">Lower means you really know it</p>
    </div>
  </section>

  <section class="panel p-6 mt-6 rise rise-2">
    <div class="flex items-baseline justify-between"><div><h2 class="font-semibold">Score per quiz</h2><p class="text-sm text-muted">% right, last ${attempts.length} quizzes. Hollow points are retries.</p></div>

    ${tableView(["Date","Topics","Score","Retry"], attempts.map(a => [a.date, a.topics, pct(a.right, a.total) + "%", a.retry ? "Yes" : ""]))}

    <div class="panel p-6 rise rise-3">
      <div class="flex items-baseline justify-between"><div><h2 class="font-semibold">Topics, weakest first</h2><p class="text-sm text-muted">Latest quiz on each topic</p></div></div>
      <div class="mt-4">${legend()}</div>
      <ul class="mt-5 space-y-5">${weakest.map(t => { const tot = t.r + t.g + t.w; return `<li>
        <div class="flex items-baseline justify-between text-sm"><span class="font-semibold">${t.name}</span><span class="tabular-nums text-muted">${pct(t.r + t.g, tot)}% right</span></div>

        <div class="flex justify-between"><dt class="text-muted">Time limit</dt><dd>20 min total</dd></div>
        <div class="flex justify-between"><dt class="text-muted">Order</dt><dd>Shuffled</dd></div>
      </dl>
      <p class="text-sm mt-6 leading-relaxed">Last time on CPU + GPU you scored <b>80%</b>.</p>`}
      <a href="#quiz" class="btn btn-primary w-full mt-6 ${err ? "btn-disabled" : ""}" onclick="${err?"setVariant('normal');return false":""}">${icon("play")}Start quiz</a>
      <p class="text-xs text-muted mt-3 text-center">Press <kbd class="kbd kbd-xs">1</kbd>–<kbd class="kbd kbd-xs">5</kbd> to answer, <kbd class="kbd kbd-xs">F</kbd> to flag a guess</p>
    </aside>
  </div>`);
}

/* ---------------- Quiz ---------------- */
const renderMd = text => text.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const quizSoFar = ["right","right","guessed","right","wrong","right"]; // the 6 answered before this one
function screenQuiz() {
  const v = state.variant;
  state.mode = v === "exam" ? "exam" : "study";
  const qi = v === "incomplete" ? 1 : state.quizIndex % quizQuestions.length;
  const q = quizQuestions[qi];
  if (v === "incomplete" && !state.answered) { state.picked = new Set([0]); state.answered = true; }
  const low = v === "timer-low";
  const answered = state.answered && state.mode === "study";
  const isRight = answered && q.correct.length === state.picked.size && q.correct.every(c => state.picked.has(c));
  const partial = answered && !isRight && [...state.picked].every(p => q.correct.includes(p)) && state.picked.size > 0;
  const current = 6 + state.quizIndex;
  const track = Array.from({ length: 20 }, (_, i) => {
    if (i < current) { const s = quizSoFar[i] || "right"; return state.mode === "exam" ? `<span style="background:var(--chart-ink)" data-tip="Question ${i + 1}: answered"></span>` : `<span style="background:${STATUS[s].color}" data-tip="Question ${i + 1}: ${s === "guessed" ? "right, guessed" : s}"></span>`; }
    if (i === current) return `<span style="background:var(--color-base-content)" data-tip="Question ${i + 1}: current"></span>`;
    return `<span data-tip="Question ${i + 1}"></span>`;
  }).join("");
  const optionClass = i => {
    if (!answered) return state.picked.has(i) ? "border-primary bg-surface ring-1 ring-primary" : "border-base-300 bg-surface hover:border-field-border";
    if (q.correct.includes(i)) return "is-right bg-surface";
    if (state.picked.has(i)) return "is-wrong bg-surface";
    return "border-base-300 opacity-60";
  };
  const optionMark = i => {
    if (!answered) return "";
    if (q.correct.includes(i)) return `<span class="text-right-ink text-sm flex items-center gap-1 font-semibold">${icon("check")}Correct</span>`;
    if (state.picked.has(i)) return `<span class="text-wrong-ink text-sm flex items-center gap-1 font-semibold">${icon("x")}Your pick</span>`;
    return "";
  };
  return `<div class="flex flex-col min-h-screen">
    <div class="px-12 pt-5 pb-4 border-b border-base-300 bg-base-100 sticky top-0 z-10">
      <div class="flex items-center gap-6">
        <span class="badge ${state.mode==="exam"?"badge-neutral":"badge-ghost"}">${state.mode === "exam" ? "Exam" : "Study"}</span>
        <span class="text-sm text-muted">CPU + GPU</span>
        <span class="text-sm tabular-nums"><b>${current + 1}</b> <span class="text-muted">of 20</span></span>
        <span class="ml-auto flex items-center gap-2 tabular-nums font-semibold ${low ? "text-warning-content bg-warning px-3 py-1 rounded-lg" : ""}" aria-live="polite">${icon("timer")}${low ? "0:58 left" : "12:40 left"}</span>
        <a href="#results" class="btn btn-ghost btn-sm font-normal">${icon("log-out")}Quit</a>
      </div>
      <div class="track mt-4" aria-label="Progress, question ${current + 1} of 20">${track}</div>
    </div>
    <div class="flex-1 px-12 py-12">
      <div class="max-w-prose mx-auto">
        <p class="eyebrow">${q.topic}${q.multi ? " · Select all that apply" : ""}</p>
        <h1 class="text-xl leading-snug mt-2 math">${q.text}</h1>
        ${q.img ? `<div class="mt-6 panel p-4">${pipelineSvg}</div>` : ""}
        ${q.code ? `<pre class="mt-6" data-code="cuda">${q.code.replace(/</g,"&lt;")}</pre>` : ""}
        <div class="mt-8 space-y-3" role="${q.multi ? "group" : "radiogroup"}">
          ${q.options.map((o, i) => `<button class="w-full min-h-12 text-left flex items-center gap-4 px-4 py-3 border rounded-lg transition-all duration-150 active:scale-[.99] ${optionClass(i)}" onclick="pick(${i})" ${answered ? "disabled" : ""} aria-pressed="${state.picked.has(i)}">
            <kbd class="kbd kbd-sm tabular-nums ${state.picked.has(i) && !answered ? "bg-primary text-primary-content border-primary" : ""}">${i + 1}</kbd><span class="flex-1 math">${o}</span>${optionMark(i)}</button>`).join("")}
        </div>
        ${answered ? `<div class="mt-8 panel p-6 rise" role="status">
          <p class="font-semibold flex items-center gap-2 ${isRight ? "text-right-ink" : "text-wrong-ink"}">${icon(isRight ? "circle-check" : "circle-x","size-5")}${isRight ? "Correct" : partial ? "Wrong: incomplete, you missed a correct option" : "Wrong"}${state.flagged ? `<span class="badge guessed-chip ml-2">${icon("flag","size-3")}Guessed</span>` : ""}</p>
          <p class="mt-3 leading-relaxed math">${renderMd(q.explain)}</p>
          <p class="text-sm text-muted mt-4 flex items-center gap-2">${icon("book-open")}${q.source}</p>
          <p class="mt-4">${openQ(5, "should study mode show the explanation here")}</p>
        </div>` : ""}
        <div class="mt-8 flex items-center gap-3">
          ${answered ? `<button class="btn btn-primary" onclick="next()">Next question <kbd class="kbd kbd-xs">Enter</kbd></button>` :
            `<button class="btn btn-primary" onclick="submitAnswer()" ${state.picked.size ? "" : "disabled"}>Submit <kbd class="kbd kbd-xs">Enter</kbd></button>`}
          <button class="btn ${state.flagged ? "" : "btn-ghost"}" style="${state.flagged ? "background:var(--guessed-tint);color:var(--guessed-ink);border-color:var(--chart-right)" : ""}" onclick="toggleFlag()" aria-pressed="${state.flagged}">${icon("flag")}${state.flagged ? "Flagged as guessed" : "I guessed"} <kbd class="kbd kbd-xs">F</kbd></button>
          ${state.mode === "study" ? `<span class="ml-auto">${openQ(6,"going back in study mode")}</span>` : `<span class="ml-auto text-sm text-muted">No going back in exam mode</span>`}
        </div>
      </div>
    </div>
  </div>`;
}
function pick(i) {
  const q = quizQuestions[state.quizIndex % quizQuestions.length];
  if (state.answered && state.mode === "study") return;
  if (q.multi) { state.picked.has(i) ? state.picked.delete(i) : state.picked.add(i); } else state.picked = new Set([i]);
  render();
}
function submitAnswer() { if (!state.picked.size) return; if (state.mode === "exam") return next(); state.answered = true; render(); }
function next() { state.quizIndex++; state.picked = new Set(); state.answered = false; state.flagged = false; render(); }
function toggleFlag() { state.flagged = !state.flagged; render(); }

/* ---------------- Results ---------------- */
function screenResults() {

  const items = (perfect ? review.slice(3) : review).map(it => `<li class="p-6">
    <div class="flex items-start gap-8">
      <div class="flex-1 max-w-prose">
        <p class="eyebrow">${it.q.topic}</p>
        <p class="mt-1 font-semibold math">${it.q.text}</p>
        <dl class="mt-3 text-sm space-y-1"><div><dt class="inline text-muted">Your answer: </dt><dd class="inline math">${it.yours}</dd></div>
        <div><dt class="inline text-muted">Correct: </dt><dd class="inline math">${it.q.correct.map(c => it.q.options[c]).join(", ")}</dd></div></dl>
        <p class="mt-3 text-sm leading-relaxed math">${renderMd(it.q.explain)}</p>
      </div>
      <div class="w-64 shrink-0">${statusBadge(it.status)}
        ${it.status === "wrong" ? (it.auto ? `<p class="text-sm mt-3">Reason: <b>${it.auto}</b> <span class="text-muted">(recorded automatically)</span></p>` :
          `<label class="block mt-3"><span class="text-sm text-muted">Why did you get it wrong? <span class="text-xs">(optional)</span></span>
            <select class="select select-sm w-full mt-1"><option>Pick a reason…</option>${reasonsList.map(x=>`<option>${x}</option>`).join("")}<option>Other (write it)</option></select></label>
            <input class="input input-sm w-full mt-2" placeholder="Or write your own reason…">`) : ""}
      </div>
    </div></li>`).join("");
  const perTopic = perfect ? [["CPU",10,0,0],["GPU",10,0,0]] : [["CPU",8,1,1],["GPU",5,2,3]]; // sums to the strip: 13 sure, 3 guessed, 4 wrong
  return page(header("Results", "CPU + GPU · Study mode · 20 questions · 14 min") + `
  <section class="panel p-8 rise">
    <div class="grid grid-cols-[auto_1fr_auto] gap-12 items-center">
      <div>
        <p class="text-6xl font-semibold leading-none">${score}<span class="text-3xl text-muted font-normal"> / 20</span></p>
        <p class="mt-3 text-sm flex items-center gap-1 text-success font-semibold">${icon("trending-up")}${perfect ? "+35" : "+15"} points <span class="text-muted font-normal">vs your last CPU + GPU quiz</span></p>
      </div>
      <div>
        ${tallBar(r, g, w)}
        <div class="mt-3">${legend()}</div>
      </div>
      <div class="text-right">${perfect ? `<p class="text-sm text-muted max-w-48">Nothing to retry. Every answer was right and none were guesses.</p>` :
        `<a href="#quiz" class="btn btn-primary">${icon("rotate-ccw")}Retry ${w + g} questions</a><p class="text-xs text-muted mt-2">${w} wrong + ${g} guessed, same settings</p>`}</div>
    </div>
    <div class="mt-8 pt-6 border-t border-base-300 grid grid-cols-[1fr_1fr] gap-12">
      <div>
        <p class="text-sm font-semibold">Question by question</p>
        <div class="grid grid-cols-10 w-fit gap-[2px] mt-3" role="list" aria-label="Each question's result">${strip.map((s, i) => `<span role="listitem" class="cell" style="background:${STATUS[s].color};color:${STATUS[s].text}" data-tip="Question ${i + 1}: ${s === "guessed" ? "right, guessed" : s}" aria-label="Question ${i + 1}: ${s}">${s === "guessed" ? `<span class="size-4 rounded-sm grid place-items-center" style="background:var(--surface)">?</span>` : STATUS[s].glyph}</span>`).join("")}</div>
      </div>
      <div>
        <p class="text-sm font-semibold">By topic</p>
        <ul class="mt-3 space-y-3">${perTopic.map(([t, a, b, c]) => `<li class="grid grid-cols-[48px_1fr_56px] items-center gap-3 text-sm"><span>${t}</span>${segBar(a, b, c, 8)}<span class="tabular-nums text-muted text-right">${a + b} / ${a + b + c}</span></li>`).join("")}</ul>
      </div>
    </div>
    ${tableView(["Question","Result"], strip.map((s, i) => [i + 1, s === "guessed" ? "Right, guessed" : s === "right" ? "Right" : "Wrong"]))}
  </section>
  <div class="mt-4">${openQ(7, 'do wrong guesses count in "guessed"')}</div>
  <div class="flex items-baseline justify-between mt-12"><h2 class="text-lg font-semibold">Review</h2><p class="text-sm text-muted">Wrong and guessed first</p></div>

}

/* ---------------- Line chart (SVG, sized to its container) ---------------- */
function drawTrend(el) {
  const W = el.clientWidth, H = el.clientHeight, m = { l: 40, r: 48, t: 12, b: 28 };
  if (W < m.l + m.r + 40) { requestAnimationFrame(() => el.isConnected && drawTrend(el)); return; }
  const pts = attempts.map((a, i) => ({ x: m.l + i * (W - m.l - m.r) / (attempts.length - 1), y: m.t + (1 - a.right / a.total) * (H - m.t - m.b), a, i }));
  const line = pts.map((p, i) => `${i ? "L" : "M"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join("");
  const area = `${line}L${pts.at(-1).x},${H - m.b}L${pts[0].x},${H - m.b}Z`;
  const grid = [0, 50, 100].map(v => { const y = m.t + (1 - v / 100) * (H - m.t - m.b); return `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="var(--chart-grid)" stroke-width="1"/><text x="${m.l - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${v}%</text>`; }).join("");
  const xl = pts.filter((_, i) => i % 2 === 0 || i === pts.length - 1).map(p => `<text x="${p.x}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${p.a.date}</text>`).join("");
  const dots = pts.map(p => `<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="${p.a.retry ? "var(--surface)" : "var(--chart-ink)"}" stroke="${p.a.retry ? "var(--chart-ink)" : "var(--surface)"}" stroke-width="2"/>`).join("");
  const last = pts.at(-1); // label the latest point
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Score per quiz, from ${pct(attempts[0].right, attempts[0].total)}% to ${pct(last.a.right, last.a.total)}%" tabindex="0" class="outline-none focus-visible:outline-2">
    ${grid}<path d="${area}" fill="var(--chart-ink)" opacity=".08"/><path d="${line}" fill="none" stroke="var(--chart-ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${xl}<line class="xh" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" stroke-width="1" opacity="0"/>${dots}
    <text x="${last.x - 8}" y="${last.y - 12}" text-anchor="end" font-size="12" font-weight="600" fill="var(--color-base-content)">${pct(last.a.right, last.a.total)}%</text>
    <rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent" class="hit"/></svg>`;
  const svg = el.querySelector("svg"), xh = svg.querySelector(".xh");
  let idx = pts.length - 1;
  const show = (i, cx, cy) => { idx = i; const p = pts[i]; xh.setAttribute("x1", p.x); xh.setAttribute("x2", p.x); xh.setAttribute("opacity", ".5");
    tip(`<b>${p.a.date}</b> · ${p.a.topics}${p.a.retry ? " (retry)" : ""}${p.a.incomplete ? " (incomplete)" : ""}<br>${p.a.right} / ${p.a.total} right · ${pct(p.a.right, p.a.total)}% · ${p.a.guessed} guessed`, cx, cy); };
  svg.addEventListener("mousemove", e => { const rx = e.clientX - svg.getBoundingClientRect().left; let best = 0; pts.forEach((p, i) => { if (Math.abs(p.x - rx) < Math.abs(pts[best].x - rx)) best = i; }); const b = svg.getBoundingClientRect(); show(best, b.left + pts[best].x, b.top + pts[best].y); });
  svg.addEventListener("mouseleave", () => { xh.setAttribute("opacity", "0"); hideTip(); });
  svg.addEventListener("keydown", e => { if (!["ArrowLeft","ArrowRight"].includes(e.key)) return; e.preventDefault(); idx = Math.max(0, Math.min(pts.length - 1, idx + (e.key === "ArrowRight" ? 1 : -1))); const b = svg.getBoundingClientRect(); show(idx, b.left + pts[idx].x, b.top + pts[idx].y); });
  svg.addEventListener("blur", () => { xh.setAttribute("opacity", "0"); hideTip(); });
}

/* ---------------- Tooltip ---------------- */
const tipEl = document.getElementById("tip");
function tip(html, x, y) { tipEl.innerHTML = html; tipEl.classList.add("show"); const r = tipEl.getBoundingClientRect(); tipEl.style.left = Math.min(x + 12, innerWidth - r.width - 8) + "px"; tipEl.style.top = Math.max(y - r.height - 12, 8) + "px"; }
function hideTip() { tipEl.classList.remove("show"); }
document.addEventListener("mouseover", e => { const t = e.target.closest("[data-tip]"); if (t) { const b = t.getBoundingClientRect(); tip(t.dataset.tip, b.left + b.width / 2, b.top); } });
document.addEventListener("mouseout", e => { if (e.target.closest("[data-tip]")) hideTip(); });

/* ---------------- Render ---------------- */
const screens = { overview: screenOverview, topics: screenTopics, editor: screenEditor, bibliography: screenBibliography, setup: screenSetup, quiz: screenQuiz, results: screenResults, history: screenHistory, search: screenSearch };
function setVariant(v) { state.variant = v; state.picked = new Set(); state.answered = false; state.flagged = false; render(); }
function render() {
  const el = document.getElementById("app");
  el.innerHTML = screens[state.screen]();
  document.querySelectorAll(".nav-link").forEach(a => {
    const on = a.dataset.nav === state.screen || (state.screen === "editor" && a.dataset.nav === "topics");
    on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
  });
  document.getElementById("states").innerHTML = variants[state.screen].map(v => `<button class="px-2 py-1 rounded ${v === state.variant ? "bg-neutral-content text-neutral font-semibold" : "hover:underline"}" onclick="setVariant('${v}')">${v}</button>`).join("");
  if (window.lucide) lucide.createIcons();
  if (window.renderMathInElement) renderMathInElement(el, { delimiters: [{ left: "$", right: "$", display: false }], throwOnError: false });
  el.querySelectorAll('[data-chart="trend"]').forEach(drawTrend);
  hideTip();
  highlight();
}
let highlighter;
async function highlight() {
  const blocks = document.querySelectorAll("pre[data-code]");
  if (!blocks.length) return;
  try {
    if (!highlighter) { const shiki = await import("https://cdn.jsdelivr.net/npm/shiki@1.22.2/+esm"); highlighter = await shiki.createHighlighter({ themes: ["min-light","min-dark"], langs: ["cpp"] }); }
    blocks.forEach(b => { b.outerHTML = highlighter.codeToHtml(b.textContent, { lang: "cpp", theme: isDark() ? "min-dark" : "min-light" }); });
  } catch (e) { blocks.forEach(b => b.classList.add("bg-surface","p-4","rounded-lg","text-sm","font-mono")); }
}
/* ---------------- Theme: dark by default, choice remembered per device ---------------- */
const isDark = () => document.documentElement.dataset.theme === "studyapp-dark";
function applyTheme(name, save = true) {
  document.documentElement.dataset.theme = name;
  document.querySelector('meta[name="theme-color"]').content = name === "studyapp-dark" ? "#18130e" : "#f9f4ee";
  document.querySelectorAll("[data-theme-choice]").forEach(b => b.setAttribute("aria-checked", b.dataset.themeChoice === name));
  if (save) { try { localStorage.setItem("studyapp-theme", name); } catch (e) {} }
  if (save) render();
}
document.getElementById("theme-switch").addEventListener("click", e => { const b = e.target.closest("[data-theme-choice]"); if (b) applyTheme(b.dataset.themeChoice); });
(() => { let saved = null; try { saved = localStorage.getItem("studyapp-theme"); } catch (e) {} applyTheme(saved === "studyapp" ? "studyapp" : "studyapp-dark", false); })();

function route() {
  const s = location.hash.slice(1) || "overview";
  state.screen = screens[s] ? s : "overview";
  state.variant = variants[state.screen][0];
  state.picked = new Set(); state.answered = false; state.flagged = false; state.quizIndex = 0;
  render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
window.addEventListener("resize", () => document.querySelectorAll('[data-chart="trend"]').forEach(drawTrend));
document.addEventListener("keydown", e => {
  if (state.screen !== "quiz" || ["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)) return;
  const q = quizQuestions[state.quizIndex % quizQuestions.length];
  if (/^[1-5]$/.test(e.key) && Number(e.key) <= q.options.length) pick(Number(e.key) - 1);
  else if (e.key === "Enter") { e.preventDefault(); state.answered ? next() : submitAnswer(); }
  else if (e.key.toLowerCase() === "f") toggleFlag();
});
route();
</script>
