<style>
  /* studyapp theme, same values as docs/design-rules.md */
  :root, [data-theme="studyapp"] {
    color-scheme: light;
    --color-base-100: oklch(97% 0.010 80);
    --color-base-200: oklch(94% 0.014 78);
    --color-base-300: oklch(89% 0.018 75);
    --color-base-content: oklch(27% 0.025 60);
    --color-primary: oklch(40% 0.065 50);
    --color-primary-content: oklch(97% 0.010 80);
    --color-secondary: oklch(32% 0.02 60);
    --color-secondary-content: oklch(94% 0.014 78);
    --color-accent: oklch(78% 0.13 78);
    --color-accent-content: oklch(27% 0.025 60);
    --color-neutral: oklch(32% 0.02 60);
    --color-neutral-content: oklch(94% 0.014 78);
    --color-info: oklch(44% 0.07 235);
    --color-info-content: oklch(97% 0.010 80);
    --color-success: oklch(42% 0.11 145);
    --color-success-content: oklch(97% 0.010 80);
    --color-warning: oklch(78% 0.13 78);
    --color-warning-content: oklch(27% 0.025 60);
    --color-error: oklch(44% 0.15 30);
    --color-error-content: oklch(97% 0.010 80);
    --radius-selector: 0.25rem;
    --radius-field: 0.375rem;
    --radius-box: 0.5rem;
    --size-selector: 0.25rem;
    --size-field: 0.25rem;
    --border: 1px;
    --depth: 0;
    --noise: 0;

    /* Raised surface for panels, and chart tokens (validated, see design rules) */
    --surface: oklch(99% 0.006 80);
    /* Quiz outcomes: blue / orange pair, colour-blind safe; guessed = hatched right */
    --chart-right: #025884;
    --chart-wrong: #cc6c13;
    --right-ink: #004d77;
    --wrong-ink: #853900;
    --guessed-tint: #c1dcf0;
    --guessed-ink: #013658;
    --guessed-fill: repeating-linear-gradient(135deg, #025884 0 2px, #c1dcf0 2px 6px);
    --chart-ink: #643d26;
    --chart-grid: oklch(91% 0.016 76);
    --muted: oklch(42% 0.022 65);
    --shadow-panel: 0 1px 2px oklch(27% 0.025 60 / .06), 0 6px 16px oklch(27% 0.025 60 / .05);
    --shadow-soft: 0 1px 2px oklch(27% 0.025 60 / .08);
    --field-border: oklch(58% 0.02 65);
    --on-right: #fff;
    --on-wrong: #140d08;
    --diagram-fill: oklch(94% 0.014 78);
  }
  /* Dark theme: its own palette, validated against the dark panel surface (see design rules) */
  [data-theme="studyapp-dark"] {
    color-scheme: dark;
    --color-base-100: oklch(19% 0.012 65);
    --color-base-200: oklch(16% 0.012 65);
    --color-base-300: oklch(32% 0.016 65);
    --color-base-content: oklch(93% 0.012 80);
    --color-primary: oklch(74% 0.10 62);
    --color-primary-content: oklch(18% 0.012 65);
    --color-secondary: oklch(88% 0.015 75);
    --color-secondary-content: oklch(18% 0.012 65);
    --color-accent: oklch(80% 0.13 80);
    --color-accent-content: oklch(18% 0.012 65);
    --color-neutral: oklch(88% 0.015 75);
    --color-neutral-content: oklch(18% 0.012 65);
    --color-info: oklch(76% 0.08 235);
    --color-info-content: oklch(18% 0.012 65);
    --color-success: oklch(76% 0.13 145);
    --color-success-content: oklch(18% 0.012 65);
    --color-warning: oklch(80% 0.13 80);
    --color-warning-content: oklch(18% 0.012 65);
    --color-error: oklch(76% 0.13 30);
    --color-error-content: oklch(18% 0.012 65);
    --radius-selector: 0.25rem; --radius-field: 0.375rem; --radius-box: 0.5rem;
    --size-selector: 0.25rem; --size-field: 0.25rem; --border: 1px; --depth: 0; --noise: 0;

    --surface: oklch(23% 0.014 65);
    --chart-right: #0573aa;
    --chart-wrong: #d67523;
    --right-ink: #87c6f2;
    --wrong-ink: #f9b379;
    --guessed-tint: #163c54;
    --guessed-ink: #bbddf6;
    --guessed-fill: repeating-linear-gradient(135deg, #0573aa 0 2px, #163c54 2px 6px);
    --chart-ink: oklch(74% 0.10 62);
    --chart-grid: oklch(30% 0.014 65);
    --muted: oklch(78% 0.016 75);
    --field-border: oklch(52% 0.018 70);
    --on-right: #fff;
    --on-wrong: #140d08;
    --diagram-fill: oklch(28% 0.014 65);
    --shadow-panel: 0 1px 0 oklch(100% 0 0 / .04) inset, 0 1px 2px oklch(0% 0 0 / .4), 0 8px 24px oklch(0% 0 0 / .25);
    --shadow-soft: 0 1px 2px oklch(0% 0 0 / .4);
  }
  body { background: var(--color-base-100); color: var(--color-base-content); font-family: "IBM Plex Sans", ui-sans-serif, sans-serif; }
  code, pre, .font-mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  h1, h2 { text-wrap: balance; }
  h1 { letter-spacing: -0.015em; }
  .input, .select, .textarea, .checkbox, .radio { border-color: var(--field-border); }
  .input, .select, .textarea { background: var(--surface); }
  :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  pre.shiki { padding: 12px 16px; border-radius: var(--radius-box); font-size: 14px; overflow-x: auto; border: 1px solid var(--color-base-300); }
  .divide-y > * { border-color: var(--color-base-300) !important; }
  .btn .kbd { background: transparent; border-color: currentColor; color: inherit; opacity: .8; }
  .btn { transition: transform 120ms ease-out, background-color 150ms ease-out, box-shadow 150ms ease-out; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn-primary { box-shadow: 0 1px 2px oklch(27% 0.025 60 / .25), inset 0 1px 0 oklch(100% 0 0 / .12); }

  /* Panels: the one raised surface. Used for groups you read as a unit (charts, summaries) */
  .panel { background: var(--surface); border: 1px solid var(--color-base-300); border-radius: 12px; box-shadow: var(--shadow-panel); }
  .eyebrow { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  /* Segmented control */
  .seg { display: inline-flex; align-items: stretch; height: 2rem; padding: 2px; gap: 2px; border: 1px solid var(--field-border); border-radius: var(--radius-field); background: var(--color-base-200); vertical-align: middle; }
  .seg > button { padding: 0 12px; font-size: 14px; line-height: 1; border-radius: calc(var(--radius-field) - 2px); color: var(--muted); transition: background-color 150ms ease-out, color 150ms ease-out; }
  .seg > button:hover:not([aria-checked="true"]) { background: var(--color-base-300); color: var(--color-base-content); }
  .seg > button[aria-checked="true"] { background: var(--color-neutral); color: var(--color-neutral-content); font-weight: 600; }
  .seg > button:focus-visible { outline-offset: 1px; }
  /* Fields: one focus ring */
  .input:focus, .input:focus-within, .select:focus, .textarea:focus { outline: none !important; border-color: var(--color-primary) !important; box-shadow: 0 0 0 1px var(--color-primary) !important; }
  label.input input:focus, label.input input:focus-visible { outline: none !important; box-shadow: none !important; }
  .input-sm, .seg { min-height: 2rem; }
  .btn:disabled .kbd { opacity: .5; }
  .toggle:checked { background-color: var(--color-primary); border-color: var(--color-primary); color: var(--color-primary-content); }
  [role=tab] .count { font-size: 12px; margin-left: 4px; color: var(--muted); font-weight: 400; }
  .open-q { border: 1px dashed var(--color-info); color: var(--color-info); background: var(--surface); }

  /* Navigation */
  .nav-link { color: var(--muted); transition: background-color 150ms ease-out, color 150ms ease-out; }
  .nav-link:hover { background: var(--color-base-300); color: var(--color-base-content); }
  .nav-link[aria-current="page"] { background: var(--surface); color: var(--color-base-content); font-weight: 600; box-shadow: var(--shadow-soft); }

  /* Charts */
  .seg-bar { display: flex; gap: 2px; border-radius: 999px; overflow: hidden; }
  .seg-bar > span { display: block; height: 100%; }
  .tall-bar { display: flex; gap: 2px; height: 28px; }
  .tall-bar > span { border-radius: 4px; display: flex; align-items: center; padding-left: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: visible; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .text-right-ink { color: var(--right-ink); } .text-wrong-ink { color: var(--wrong-ink); }
  .is-right { border-color: var(--chart-right) !important; box-shadow: 0 0 0 1px var(--chart-right); }
  .is-wrong { border-color: var(--chart-wrong) !important; box-shadow: 0 0 0 1px var(--chart-wrong); }
  .guessed-chip { background: var(--guessed-tint); color: var(--guessed-ink); border-color: var(--guessed-tint); }
  .hbar { height: 12px; border-radius: 0 4px 4px 0; background: var(--chart-ink); transition: width 400ms ease-out; }
  .cell { width: 24px; height: 24px; border-radius: 4px; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #fff; }
  .chart-tip { position: fixed; pointer-events: none; z-index: 50; background: var(--color-neutral); color: var(--color-neutral-content); font-size: 12px; line-height: 1.4; padding: 8px 10px; border-radius: 6px; box-shadow: 0 4px 12px oklch(27% 0.025 60 / .2); opacity: 0; transition: opacity 120ms ease-out; max-width: 240px; }
  .chart-tip.show { opacity: 1; }
  details.table-view summary { cursor: pointer; font-size: 12px; color: var(--muted); }

  /* Quiz progress track */
  .track { display: flex; gap: 2px; height: 6px; }
  .track > span { flex: 1; border-radius: 2px; background: var(--color-base-300); }

  /* Motion */
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise 260ms ease-out both; }
  .rise-2 { animation-delay: 60ms; } .rise-3 { animation-delay: 120ms; } .rise-4 { animation-delay: 180ms; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
<style type="text/tailwindcss">
  @theme {
    --color-muted: var(--muted);
    --color-field-border: var(--field-border);
    --color-surface: var(--surface);
    --font-sans: "IBM Plex Sans", ui-sans-serif, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
</style>
<style>
  /* Flashcards additions. Same tokens as the MVP and free recall prototypes. */
  .queue-now { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
  .grade { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 7.5rem; padding: 10px 16px; height: auto; }
  .grade .when { font-size: 12px; font-weight: 400; opacity: .85; font-variant-numeric: tabular-nums; }
  .grade-again { color: var(--wrong-ink); border-color: var(--field-border); }
  .badge-src { font-size: 12px; color: var(--muted); border: 1px solid var(--color-base-300); border-radius: 4px; padding: 0 6px; line-height: 20px; white-space: nowrap; }
  .text-right-ink { color: var(--right-ink); } .text-wrong-ink { color: var(--wrong-ink); }
  .forecast { display: flex; align-items: flex-end; gap: 4px; height: 64px; }
  .forecast > span { flex: 1; background: var(--chart-ink); border-radius: 3px 3px 0 0; min-height: 2px; }
  .rich > * + * { margin-top: .75em; }
  .rich code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .9em; }
  .rich :not(pre) > code { background: var(--color-base-200); padding: .1em .35em; border-radius: 4px; }
</style>
</head>

<div class="fixed bottom-4 right-4 bg-neutral text-neutral-content rounded-lg px-3 py-2 text-xs flex items-center gap-2 shadow-lg z-40 max-w-[72vw] flex-wrap" aria-label="Prototype state">
  <span class="opacity-70">Screen</span><div id="screens" class="flex gap-1 flex-wrap"></div>
  <span class="opacity-70 ml-2">State</span><div id="states" class="flex gap-1 flex-wrap"></div>
</div>

<script>
const icon = (name, cls = "size-4") => `<i data-lucide="${name}" class="${cls}" aria-hidden="true"></i>`;
const openQ = (n, text) => `<span class="open-q inline-flex items-center gap-1 rounded-md px-2 py-0.5 text-xs" title="Open question ${n}, see design/README.md">${icon("circle-help","size-3")}Open ${n}: ${text}</span>`;
const header = (title, subtitle = "", actions = "") => `<header class="flex items-end justify-between gap-6 pt-12 pb-8"><div><h1 class="text-3xl font-semibold leading-tight">${title}</h1>${subtitle ? `<p class="mt-2 text-muted">${subtitle}</p>` : ""}</div><div class="flex items-center gap-2">${actions}</div></header>`;
const counts = (n, l, r) => `<span class="tabular-nums"><span class="font-semibold">${n}</span> <span class="text-muted">new</span></span><span class="text-muted" aria-hidden="true">·</span><span class="tabular-nums"><span class="font-semibold">${l}</span> <span class="text-muted">learning</span></span><span class="text-muted" aria-hidden="true">·</span><span class="tabular-nums"><span class="font-semibold">${r}</span> <span class="text-muted">to review</span></span>`;

/* ---------------- Sample data ---------------- */
const topics = [
  { name: "CPU", module: "Computer Architecture", total: 24, n: 4, l: 2, r: 9, retention: 91 },
  { name: "Memory", module: "Computer Architecture", total: 18, n: 6, l: 1, r: 3, retention: 88 },
  { name: "OSI model", module: "Networks", total: 30, n: 0, l: 0, r: 2, retention: 79 },
  { name: "Cryptography", module: "Cryptography", total: 12, n: 0, l: 0, r: 0, retention: 94 },
];
const cards = [
  { front: "I need the CPU to fetch an instruction and its data in the same cycle. Which design lets it?", back: "**Harvard architecture**: separate instruction and data memory, so both can be read at once.", src: "Written", next: "Today", lapses: 0, state: "Review" },
  { front: "A load is followed straight away by an instruction that uses its result. What still forces a stall with forwarding?", back: "A **load-use hazard**. The value isn't ready until after the memory stage.", src: "From recall miss", next: "Today", lapses: 1, state: "Review" },
  { front: "I've sped up 60% of a program by 4×. How do I work out the overall speedup?", back: "Amdahl's law: $S = \\frac{1}{(1-p) + p/n}$, so $\\frac{1}{0.4 + 0.15} \\approx 1.82\\times$", src: "From wrong MCQ", next: "Today", lapses: 9, state: "Review", leech: true },
  { front: "The compiler keeps caching a memory-mapped register in a CPU register. What stops it?", back: "Declare it `volatile`:\n\n```c\nvolatile uint32_t *status = (uint32_t *)0x40021000;\n```", src: "Written", next: "Thu 5 Nov", lapses: 0, state: "Review" },
  { front: "Which stage reads the registers?", back: "Decode", src: "From wrong MCQ", next: "New", lapses: 0, state: "New" },
  { front: "Why does a direct-mapped cache get conflict misses that a 2-way one avoids?", back: "Two hot addresses that map to the same line keep evicting each other. With 2 ways both fit in the set.", src: "Written", next: "Sat 7 Nov", lapses: 0, state: "Suspended" },
];
const suggestions = [
  { from: "Recall: Computer Architecture, 3 Nov", kind: "recall", miss: "Memory-mapped I/O vs port I/O", note: "Missed 4 of 6 checks" },
  { from: "Recall: Computer Architecture, 3 Nov", kind: "recall", miss: "Control hazards: branch prediction, the cost of a misprediction", note: "Missed 2 of 6 checks" },
  { from: "Quiz: CPU, 2 Nov", kind: "mcq", miss: "What does the program counter hold?", answer: "The address of the next instruction", note: "Wrong, you picked “The current instruction”" },
  { from: "Quiz: Memory, 1 Nov", kind: "mcq", miss: "What does the TLB cache?", answer: "Virtual to physical page translations", note: "Right but guessed" },
];

/* ---------------- State ---------------- */
const variants = {
  cards: ["due today", "all done", "first time", "settings"],
  topic: ["cards", "new card", "edit leech card"],
  review: ["front", "answer", "leech", "done"],
  suggestions: ["list", "make a card"],
};
const state = { screen: "cards", variant: "due today" };

/* ---------------- Cards home ---------------- */
function screenCards() {
  const v = state.variant;
  if (v === "first time") return `<div class="mx-auto max-w-6xl px-12 pb-24">${header("Cards")}
    <div class="panel max-w-xl p-10 rise">
      <span class="grid size-10 place-items-center rounded-lg bg-base-200">${icon("square-stack","size-5")}</span>
      <h2 class="mt-6 text-xl font-semibold">No cards yet</h2>
      <p class="mt-2 text-muted max-w-prose">Cards are for the things you keep forgetting. Write them in a topic, or make them from what you missed in a recall or got wrong in a quiz. The app picks which ones to show each day, so you only see a card just before you'd forget it.</p>
      <div class="mt-6 flex gap-3"><button class="btn btn-primary" onclick="go('topic','new card')">${icon("plus")}Write your first card</button></div>
    </div></div>`;
  const done = v === "all done";
  const dueTotal = done ? 0 : 27;
  return `<div class="mx-auto max-w-6xl px-12 pb-24">
    ${header("Cards", done ? "All reviewed for today" : `${dueTotal} due today`, `<button class="btn btn-ghost" onclick="setVariant('settings')">${icon("settings-2")}Settings</button><button class="btn btn-ghost" onclick="go('topic','new card')">${icon("plus")}New card</button>`)}
    <div class="grid grid-cols-[1fr_340px] gap-8 items-start">
      <section class="panel p-8 rise" aria-labelledby="today-h">
        <h2 id="today-h" class="eyebrow">Today</h2>
        ${done ? `<div class="mt-4 flex items-center gap-4">${icon("circle-check","size-6")}<div><p class="text-2xl font-semibold">Done for today</p><p class="mt-1 text-muted">43 reviewed in 18 min. 9 are due tomorrow.</p></div></div>`
        : `<p class="mt-4 text-5xl font-semibold tabular-nums leading-none">27 <span class="text-lg font-normal text-muted">cards</span></p>
          <p class="mt-4 flex flex-wrap items-center gap-3 text-sm">${counts(10, 3, 14)}</p>
          <p class="mt-2 text-sm text-muted">About 12 minutes. New cards are capped at 10 a day.</p>
          <div class="mt-8 flex items-center gap-3"><button class="btn btn-primary btn-lg" onclick="go('review','front')">${icon("play")}Start review <kbd class="kbd kbd-xs">Enter</kbd></button>
            <select class="select w-56" aria-label="Review which topics"><option>All topics</option><optgroup label="Modules"><option>Computer Architecture</option><option>Networks</option></optgroup><optgroup label="Topics"><option>CPU</option><option>Memory</option><option>OSI model</option></optgroup></select></div>`}
        <div class="mt-10">
          <div class="flex items-baseline justify-between"><h3 class="text-sm font-semibold">Next 14 days</h3><span class="text-xs text-muted">cards due per day</span></div>

/* ---------------- Markdown-lite for the prototype ---------------- */
function markdown(md) {
  return md.replace(/```(\w+)\n([\s\S]*?)```/g, (_, lang, code) => `<pre data-code class="text-sm">${code.replace(/</g, "&lt;")}</pre>`)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>").split(/\n\n/).map(p => p.startsWith("<pre") ? p : `<p>${p}</p>`).join("");
}

/* ---------------- Render ---------------- */
const screens = { cards: screenCards, topic: screenTopic, review: screenReview, suggestions: screenSuggestions };
const screenNames = { cards: "Cards", topic: "Topic cards", review: "Review", suggestions: "Suggestions" };
function setVariant(v) { state.variant = v; render(); }
function go(screen, v) { state.screen = screen; state.variant = v || variants[screen][0]; try { history.replaceState(null, "", `#${screen}`); } catch (e) {} render(); window.scrollTo(0, 0); }
function render() {
  const el = document.getElementById("app");
  el.innerHTML = screens[state.screen]();
  document.querySelector('nav[aria-label="Main"]').hidden = state.screen === "review" && state.variant !== "done";
  document.getElementById("due-badge").hidden = (state.screen === "cards" && ["all done", "first time"].includes(state.variant)) || (state.screen === "review" && state.variant === "done");
  document.querySelectorAll(".nav-link").forEach(a => a.dataset.nav === "cards" ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.getElementById("screens").innerHTML = Object.keys(screens).map(s => `<button class="px-2 py-1 rounded ${s === state.screen ? "bg-neutral-content text-neutral font-semibold" : "hover:underline"}" onclick="go('${s}')">${screenNames[s]}</button>`).join("");
  document.getElementById("states").innerHTML = variants[state.screen].map(v => `<button class="px-2 py-1 rounded ${v === state.variant ? "bg-neutral-content text-neutral font-semibold" : "hover:underline"}" onclick="setVariant('${v}')">${v}</button>`).join("");
  if (window.lucide) lucide.createIcons();
  if (window.renderMathInElement) renderMathInElement(el, { delimiters: [{ left: "$", right: "$", display: false }], throwOnError: false });
  el.querySelectorAll("pre[data-code]").forEach(b => b.classList.add("bg-surface", "p-4", "rounded-lg", "font-mono", "border", "border-base-300"));
  const dialog = el.querySelector("dialog[open]");
  if (dialog) dialog.querySelector("input, select, button")?.focus();
}

const isDark = () => document.documentElement.dataset.theme === "studyapp-dark";
function applyTheme(name, save = true) {
  document.documentElement.dataset.theme = name;
  document.querySelector('meta[name="theme-color"]').content = name === "studyapp-dark" ? "#18130e" : "#f9f4ee";
  document.querySelectorAll("[data-theme-choice]").forEach(b => b.setAttribute("aria-checked", b.dataset.themeChoice === name));
  if (save) { try { localStorage.setItem("studyapp-theme", name); } catch (e) {} render(); }
}
document.getElementById("theme-switch").addEventListener("click", e => { const b = e.target.closest("[data-theme-choice]"); if (b) applyTheme(b.dataset.themeChoice); });
(() => { let saved = null; try { saved = localStorage.getItem("studyapp-theme"); } catch (e) {} applyTheme(saved === "studyapp" ? "studyapp" : "studyapp-dark", false); })();

document.addEventListener("keydown", e => {
  if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  if (e.key === "Escape" && document.querySelector("dialog[open]")) setVariant("due today");
  if (state.screen !== "review") return;
  if (state.variant === "front" && e.key === " ") { e.preventDefault(); setVariant("answer"); }
  else if (["answer", "leech"].includes(state.variant) && /^[1-4 ]$/.test(e.key)) { e.preventDefault(); setVariant("front"); }
  else if (state.variant === "leech" && e.key.toLowerCase() === "e") go("topic", "edit leech card");
});
const start = location.hash.slice(1);
if (screens[start]) state.screen = start, state.variant = variants[start][0];
render();
</script>
</body>
