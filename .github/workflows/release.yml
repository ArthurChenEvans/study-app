# Releases (updates.feature, R165). Every push to the release branch is a new version:
#
#   1. the Fedora update test runs first (a release that can't update itself isn't published)
#   2. the version is 0.1.<run number>, so each release is newer than the last
#   3. the .rpm is built and signed with the key in the TAURI_SIGNING_PRIVATE_KEY secret
#   4. it's published as a GitHub Release (tag v0.1.N) with latest.json, which is what the
#      installed app checks on open and close
#
# The Windows installers are built too and kept as the run's Artifacts. It can also be run by
# hand from the Actions tab ("Release", then "Run workflow").
name: Release

on:
  workflow_dispatch:
  push:
    branches: [release]

concurrency: release

jobs:
  update-test:
    uses: ./.github/workflows/updates-e2e.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  linux:
    needs: [update-test, version]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check the signing key is set
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret first (Settings, Secrets and variables, Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm jq
      - run: pnpm install --frozen-lockfile

      - name: Build the signed .rpm
        run: |
          jq -n --arg v "$VERSION" '{version: $v}' > "$RUNNER_TEMP/version.json"
          pnpm tauri build --bundles rpm --config "$RUNNER_TEMP/version.json"
          built=$(ls target/release/bundle/rpm/*-"$VERSION"-*.rpm)
          [ -f "$built.sig" ] || pnpm tauri signer sign "$built"
          # A name without spaces, so the link in latest.json matches what GitHub stores.
          rpm="study-app-$VERSION.x86_64.rpm"
          cp "$built" "$rpm"; cp "$built.sig" "$rpm.sig"
          echo "RPM=$rpm" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          git log --no-merges --format='- %s' ${last:+$last..}HEAD | head -40 > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name=$(basename "$RPM")
          url="https://github.com/${{ github.repository }}/releases/download/v$VERSION/$name"
          python3 scripts/latest-json.py "$VERSION" "$RPM" "$url" "$RUNNER_TEMP/notes.md" latest.json
          gh release create "v$VERSION" "$RPM" "$RPM.sig" latest.json \
            --target "${{ github.sha }}" --title "Study App $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest

  windows:
    needs: [update-test, version]
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: pnpm install --frozen-lockfile
      - name: Build the installers
        shell: bash
        run: |
          echo '{"version": "${{ needs.version.outputs.version }}"}' > version.json
          pnpm tauri build --bundles nsis,msi --config version.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
