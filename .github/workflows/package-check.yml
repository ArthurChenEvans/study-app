# Builds the packages a release makes, without signing or publishing anything, so a broken
# .deb, Void .xbps or Mac build shows up on the pull request instead of halfway through a release (R187).
name: Package check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/package-check.yml"
      - "src-tauri/**"
      - "Cargo.lock"
      - "scripts/make-xbps.sh"

jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: pnpm install --frozen-lockfile
      - name: Build the .deb
        run: |
          echo '{"bundle": {"createUpdaterArtifacts": false}}' > "$RUNNER_TEMP/unsigned.json"
          pnpm tauri build --bundles deb --config "$RUNNER_TEMP/unsigned.json"
          deb=$(ls target/release/bundle/deb/*.deb)
          dpkg-deb --info "$deb"
          sudo apt-get install -y "./$deb"
          dpkg -s shudhana | grep -E "^(Package|Version|Status)"
          mkdir -p out && cp "$deb" out/shudhana.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: out/

  void:
    needs: deb
    runs-on: ubuntu-latest
    container: ghcr.io/void-linux/void-glibc-full:latest
    env:
      VERSION: 0.0.0
      DEB: deb/shudhana.deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: deb
      - name: Void tools
        run: |
          xbps-install -Syu xbps
          xbps-install -Syu
          xbps-install -y bash binutils bsdtar
      - name: Build the .xbps
        run: bash scripts/make-xbps.sh "$DEB" "$VERSION" void-out
      - name: Install it on Void to check it works
        run: |
          xbps-rindex -a void-out/*.xbps
          xbps-install -y --repository="$PWD/void-out" shudhana
          xbps-query shudhana | grep -E "^(pkgver|shlib-requires)"
          test -f /usr/share/shudhana/installed-by-xbps
          for binary in $(xbps-query -f shudhana | grep '^/usr/bin/'); do
            if ldd "$binary" | grep "not found"; then echo "::error::$binary is missing libraries on Void"; exit 1; fi
          done

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: pnpm install --frozen-lockfile
      - name: Build the universal app and .dmg
        run: |
          echo '{"bundle": {"createUpdaterArtifacts": false}}' > unsigned.json
          pnpm tauri build --target universal-apple-darwin --bundles app,dmg --config unsigned.json
          bundle=target/universal-apple-darwin/release/bundle
          ls -la "$bundle"/macos "$bundle"/dmg
          lipo -archs "$bundle"/macos/*.app/Contents/MacOS/*
