# Builds the packages a release makes, without signing or publishing anything, so a broken
# .deb or Mac build shows up on the pull request instead of halfway through a release (R187).
name: Package check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/package-check.yml"
      - "src-tauri/**"
      - "Cargo.lock"

jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: pnpm install --frozen-lockfile
      - name: Build the .deb
        run: |
          echo '{"bundle": {"createUpdaterArtifacts": false}}' > "$RUNNER_TEMP/unsigned.json"
          pnpm tauri build --bundles deb --config "$RUNNER_TEMP/unsigned.json"
          deb=$(ls target/release/bundle/deb/*.deb)
          dpkg-deb --info "$deb"
          sudo apt-get install -y "./$deb"
          dpkg -s shudhana | grep -E "^(Package|Version|Status)"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: pnpm install --frozen-lockfile
      - name: Build the universal app and .dmg
        run: |
          echo '{"bundle": {"createUpdaterArtifacts": false}}' > unsigned.json
          pnpm tauri build --target universal-apple-darwin --bundles app,dmg --config unsigned.json
          bundle=target/universal-apple-darwin/release/bundle
          ls -la "$bundle"/macos "$bundle"/dmg
          lipo -archs "$bundle"/macos/*.app/Contents/MacOS/*
