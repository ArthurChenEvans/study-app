# R211: the phone version. Tests the core in headless Chrome, builds the site, and publishes
# it to GitHub Pages from main. (Settings, Pages, Source: GitHub Actions, once.)
name: Phone version
on:
  push:
    branches: [main, phone-spike]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: phone-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg getrandom_backend="wasm_js"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Run the core in headless Chrome
        run: wasm-pack test --headless --chrome crates/study-phone
      - name: Build the phone site
        run: BASE=/${{ github.event.repository.name }}/ ./scripts/phone-build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-phone
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
