[package]
name = "study-store"
description = "SQLite storage for the Study App"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.22"
rusqlite = { version = "0.41.1", features = ["bundled", "backup", "functions"] }
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
study-core = { path = "../study-core" }
thiserror = "2.0.21"
