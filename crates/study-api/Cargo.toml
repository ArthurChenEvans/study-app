[package]
name = "study-api"
description = "Everything the Study App's Tauri commands do, as plain testable functions"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9", default-features = false, features = ["deflate"] }
study-core = { path = "../study-core" }
study-store = { path = "../study-store" }
thiserror = "2.0.21"
zstd = "0.13"
rusqlite = { version = "0.41.1", features = ["bundled", "collation"] }
tempfile = "3.27.0"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
trace = ["study-store/trace"]
