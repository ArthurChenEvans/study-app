[package]
name = "study-web"
description = "Study App in the browser: the same study-api behind HTTP, for testing with throwaway databases"
version.workspace = true
edition.workspace = true

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
study-core = { path = "../study-core" }
study-store = { path = "../study-store" }
study-api = { path = "../study-api" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
