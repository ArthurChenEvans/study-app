[package]
name = "study-phone"
version = "0.1.0"
edition = "2024"
publish = false

# R211 spike: the study core in the browser, for the phone version. The database lives in
# memory, loaded from the account's change lines each time the app opens.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
study-store = { path = "../study-store" }
study-core = { path = "../study-core" }
study-api = { path = "../study-api" }
serde_json = "1"
serde-wasm-bindgen = "0.6"
chrono = { version = "0.4", default-features = false, features = ["std"] }
base64 = "0.22"
serde = "1"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["XmlHttpRequest"] }
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
# Each version in the tree is told to use the browser for randomness.
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

# Only in the browser build: the browser supplies SQLite with the time, randomness and sleep.
[target.'cfg(target_arch = "wasm32")'.dependencies]
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
