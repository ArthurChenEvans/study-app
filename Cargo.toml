[workspace]
resolver = "2"
members = ["crates/study-core", "crates/study-store", "crates/study-api", "src-tauri"]
# The Tauri shell needs WebKitGTK to build, so plain `cargo test` covers the testable crates.
default-members = ["crates/study-core", "crates/study-store", "crates/study-api"]

[workspace.package]
edition = "2024"
version = "0.1.0"
